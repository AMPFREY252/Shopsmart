<body>
<div id="app"></div>
<div id="modal-root" class="no-print"></div>
<div id="toast-root" class="fixed z-50 bottom-4 right-4 flex flex-col gap-2 items-end no-print"></div>
<div id="print-area" style="display:none"></div>
<script>
'use strict';

/* ================= Core: state, helpers, storage ================= */
const DB_KEY = 'shopsmart_db_v1';
const SESSION_KEY = 'shopsmart_session_v1';
const PLANS = {
  small: { name: 'Small Shop', price: 50000 },
  big: { name: 'Big Shop', price: 100000 },
  branches: { name: 'Many Branches', price: 150000 }
};
const PTYPES = ['Food', 'Electronics', 'Household', 'Stationery'];
const METHODS = ['Cash', 'MTN MoMo', 'Airtel Money', 'Credit'];
const EXPENSE_CATS = ['Rent', 'Transport', 'Airtime', 'Salary', 'Water', 'Electricity', 'Other'];

let DB = null;
let S = {
  page: 'home', user: null, loginRole: 'admin', regPlan: 'small', menu: false,
  posQ: '', posType: 'All', cart: [], discount: 0, method: 'Cash', paid: '', creditCust: '',
  prodQ: '', prodType: 'All', lowOnly: false,
  repTab: 'sales', repFrom: '', repTo: '', lastSale: null, regError: '', loginError: ''
};

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function fmt(n) {
  n = Number(n);
  if (!isFinite(n)) n = 0;
  return Math.round(n).toLocaleString('en-US');
}
function cur() { const sh = myShop(); return (sh && sh.currency) || 'UGX'; }
function ugx(n) { return cur() + ' ' + fmt(n); }
function uid(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function pad4(n) { return String(n).padStart(4, '0'); }
function dayKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function shiftDay(n) { const d = new Date(); d.setDate(d.getDate() + n); return d; }
function fmtDate(k) {
  if (!k) return '';
  const p = String(k).split('-');
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fmtShort(k) {
  if (!k) return '';
  const p = String(k).split('-');
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
}
function fmtTime(iso) {
  const d = new Date(iso);
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function sum(arr, fn) { let t = 0; for (let i = 0; i < arr.length; i++) t += fn ? fn(arr[i]) : arr[i]; return t; }
function myShop() { return (S.user && S.user.shopId) ? DB.shops.find(s => s.id === S.user.shopId) : null; }
function shopById(id) { return DB.shops.find(s => s.id === id); }
function productsOf(id) { return DB.products.filter(p => p.shopId === id); }
function customersOf(id) { return DB.customers.filter(c => c.shopId === id); }
function suppliersOf(id) { return DB.suppliers.filter(s => s.shopId === id); }
function expensesOf(id) { return DB.expenses.filter(e => e.shopId === id); }
function salesOf(id) { return DB.sales.filter(s => s.shopId === id); }
function salesOn(id, day) { return DB.sales.filter(s => s.shopId === id && s.day === day); }
function salesBetween(id, from, to) {
  return DB.sales.filter(s => s.shopId === id && (!from || s.day >= from) && (!to || s.day <= to));
}
function expensesOn(id, day) { return DB.expenses.filter(e => e.shopId === id && e.day === day); }
function saleCost(s) { return sum(s.items, i => i.buy * i.qty); }
function saleProfit(s) { return s.total - saleCost(s); }
function persist() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch (e) { console.warn('persist failed', e); }
}
function demoSuperUser() {
  return {
    id: 'u_super', shopId: null, name: 'ShopSmart Owner',
    email: 'super@shopsmart.com', password: 'super123',
    role: 'super', phone: '0700000001', status: 'active'
  };

function mergeSeedRows(key, fresh) {

function dashStats() {
  const sh = myShop(), k = dayKey();
  const t = salesOn(sh.id, k);
  const sales = sum(t, s => s.total);
  const cost = sum(t, saleCost);
  const exp = sum(expensesOn(sh.id, k), e => e.amount);
  const opening = DB.openings[sh.id + '|' + k] || 0;
  const low = productsOf(sh.id).filter(p => p.stock <= sh.lowStockLevel);
  const owed = sum(customersOf(sh.id), c => c.owed);
  return { sales, cost, exp, profit: sales - cost - exp, low, owed, cash: opening + sales - exp, opening, count: t.length };
}

/* ================= Seed continuation: sales, suppliers, customers, expenses ================= */
function seedRest(db, defs, rnd, now) {
  // --- suppliers + purchases + customers per shop ---
  const supTpl = [
    ['Kampala Wholesale Distributors', '0772111222', 'Kampala'],
    ['Mbarara Farm Supplies', '0752333444', 'Mbarara'],
    ['Rwenzori Electronics Ltd', '0702555666', 'Fort Portal']
  ];
  const cusTpl = [
    ['Agnes Nabukwasi', '0772555001'],
    ['Robert Baguma', '0772555002'],
    ['Cynthia Akiiki', '0772555003'],
    ['Francis Byaruhanga', '0772555004'],
    ['Diana Nabaasa', '0772555005']
  ];

  defs.forEach(function (sh, si) {
    const prods = db.products.filter(p => p.shopId === sh.id);

    supTpl.slice(0, 2 + (si % 2)).forEach(function (t, ui) {
      const sup = { id: 'su_' + sh.id + '_' + ui, shopId: sh.id, name: t[0], phone: t[1], location: t[2], owed: 0 };
      db.suppliers.push(sup);
      for (let k = 0; k < 2; k++) {
        const p = prods[(ui * 7 + k * 3) % prods.length];
        const qty = 10 + Math.floor(rnd() * 30);
        const unit = Math.round(p.buy * (0.95 + rnd() * 0.1));
        const cost = qty * unit;
        const paid = Math.min(k === 0 ? cost : Math.round(cost * (0.4 + rnd() * 0.4) / 500) * 500, cost);
        const d = new Date(now); d.setDate(d.getDate() - (3 + ui * 5 + k * 4));
        db.purchases.push({
          id: uid('pu'), shopId: sh.id, day: dayKey(d), supplierId: sup.id, supplierName: sup.name,
          productId: p.id, productName: p.name, qty: qty, cost: cost, paid: paid, balance: cost - paid
        });
        sup.owed += cost - paid;
      }
    });

    const custs = [];
    cusTpl.slice(0, 4 + (si % 2)).forEach(function (t, ci) {
      const c = { id: 'cu_' + sh.id + '_' + ci, shopId: sh.id, name: t[0], phone: t[1], totalBought: 0, owed: 0, due: '' };
      const bought = 80000 + Math.floor(rnd() * 900000);
      c.totalBought = bought;
      db.customers.push(c);
      custs.push(c);
    });

    // --- expenses over last week ---
    const exps = [['Rent', -6, 150000 + si * 50000], ['Transport', -5, 20000], ['Airtime', -4, 5000],
      ['Salary', -3, 250000], ['Water', -2, 15000], ['Transport', -1, 10000], ['Airtime', 0, 3000]];
    exps.forEach(function (e) {
      const d = shiftDay(e[1]);
      db.expenses.push({ id: uid('ex'), shopId: sh.id, day: dayKey(d), cat: e[0], amount: e[2], note: '' });
    });
    db.openings[sh.id + '|' + dayKey(now)] = [200000, 100000, 300000][si];

    // --- 7 days of sales ---
    const shop = db.shops.find(s => s.id === sh.id);
    const cashiers = db.users.filter(u => u.shopId === sh.id && u.role === 'cashier');
    for (let d = 6; d >= 0; d--) {
      const base = shiftDay(-d);
      const n = 4 + Math.floor(rnd() * 6);
      for (let i = 0; i < n; i++) {
        const dt = new Date(base);
        dt.setHours(8 + Math.floor(rnd() * 11), Math.floor(rnd() * 60), 0, 0);
        if (dt.getTime() > now.getTime()) dt.setTime(now.getTime() - Math.floor(rnd() * 1800000));
        const nItems = 1 + Math.floor(rnd() * 3);
        const seen = {}, items = [];
        for (let j = 0; j < nItems; j++) {
          const p = prods[Math.floor(rnd() * prods.length)];
          if (seen[p.id]) continue;
          seen[p.id] = 1;
          let qty = 1 + Math.floor(rnd() * 5);
          if (rnd() < 0.09) qty = 10 + Math.floor(rnd() * 6);
          items.push({ pid: p.id, name: p.name, qty: qty, price: qty >= 10 ? p.wholesale : p.retail, buy: p.buy });
        }
        if (!items.length) continue;
        const subtotal = sum(items, it => it.price * it.qty);
        const discount = rnd() < 0.18 ? Math.floor(rnd() * 4) * 500 : 0;
        const total = Math.max(0, subtotal - discount);
        const mr = rnd();
        const method = mr < 0.5 ? 'Cash' : mr < 0.75 ? 'MTN MoMo' : mr < 0.88 ? 'Airtel Money' : 'Credit';
        let paid = total, change = 0, custId = null;
        if (method === 'Cash') { paid = Math.ceil(total / 1000) * 1000; change = paid - total; }
        if (method === 'Credit') {
          paid = 0;
          const c = custs[Math.floor(rnd() * custs.length)];
          custId = c.id;
          c.owed += total;
          c.due = dayKey(new Date(dt.getTime() + 7 * 864e5));
        }
        const cidx = Math.floor(rnd() * cashiers.length);
        shop.seq += 1;
        db.sales.push({
          id: uid('s'), shopId: sh.id, day: dayKey(dt), ts: dt.toISOString(),
          receipt: shop.prefix + '-' + pad4(shop.seq),
          cashierId: cashiers.length ? cashiers[cidx].id : null,
          cashier: cashiers.length ? cashiers[cidx].name : shop.owner,
          items: items, subtotal: subtotal, discount: discount, total: total,
          method: method, paid: paid, change: change, customerId: custId
        });
      }
    }

    // guarantee customers who owe money (one overdue, one upcoming)
    custs.slice(0, 2).forEach(function (c, i) {
      if (c.owed <= 0) {
        const extra = 90000 + i * 60000;
        c.owed = extra;
        c.totalBought += extra;
      }
      if (!c.due) c.due = dayKey(shiftDay(i === 0 ? -3 : 5));
    });
    if (custs[0]) {
      const paidAmt = Math.min(25000, custs[0].owed);
      custs[0].owed -= paidAmt;
      db.debtPayments.push({ id: uid('dp'), shopId: sh.id, customerId: custs[0].id, day: dayKey(shiftDay(-2)), amount: paidAmt });
    }
  });

  db.broadcasts.push({
    id: uid('bc'), date: new Date(now.getTime() - 2 * 864e5).toISOString(),
    message: 'Welcome to ShopSmart! Wholesale prices now apply automatically when a customer buys 10 or more of an item. Karibu sana!'
  });
}

const HOME_TITLES = ['home', 'register'];
const ADMIN_PAGES = ['dashboard', 'pos', 'products', 'suppliers', 'customers', 'expenses', 'reports', 'staff', 'settings'];

function render() {
  const app = document.getElementById('app');
  if (!S.user) {
    app.innerHTML = S.page === 'register' ? pageRegister() : pageHome();
    afterRender();
    return;
  }
  // role guards
  if (S.user.role === 'super' && S.page !== 'super') S.page = 'super';
  if (S.user.role === 'cashier' && S.page !== 'pos') S.page = 'pos';
  if (S.user.role === 'admin' && S.page === 'super') S.page = 'dashboard';
  if (S.user.role === 'admin' && ADMIN_PAGES.indexOf(S.page) === -1) S.page = 'dashboard';

  let content = '';
  switch (S.page) {
    case 'super': content = pageSuper(); break;
    case 'dashboard': content = pageDashboard(); break;
    case 'pos': content = pagePOS(); break;
    case 'products': content = pageProducts(); break;
    case 'suppliers': content = pageSuppliers(); break;
    case 'customers': content = pageCustomers(); break;
    case 'expenses': content = pageExpenses(); break;
    case 'reports': content = pageReports(); break;
    case 'staff': content = pageStaff(); break;
    case 'settings': content = pageSettings(); break;
    default: content = pageDashboard();
  }
  app.innerHTML = shell(content);
  afterRender();
}
function afterRender() {
  const focusId = S.focusNext;
  S.focusNext = null;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el.focus) { el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); }
  }
  const fill = S.demoFill;
  S.demoFill = null;
  if (fill) {
    const em = document.getElementById('login-email');
    const pw = document.getElementById('login-pass');
    if (em) em.value = fill.email || '';
    if (pw) pw.value = fill.pass || '';
    if (fill.auto) doLogin();
    else if (em) em.focus();
  }
}
function go(page) {
  S.page = page;
  S.menu = false;
  if (page === 'pos' && S.user && S.user.role !== 'admin') { /* keep cart */ }
  window.scrollTo(0, 0);
  render();
}
function loginAs(user) {
  S.user = user;

function logout() {
  S.user = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { }
  S.page = 'home';
  closeModal();
  render();
}
function doLogin() {
  loadDB();
  const email = (document.getElementById('login-email').value || '').trim().toLowerCase();
  const pass = document.getElementById('login-pass').value || '';
  const errEl = document.getElementById('login-error');
  const fail = function (msg) {
    S.loginError = msg;
    if (errEl) { errEl.textContent = msg; errEl.className = 'text-xs font-semibold text-red-600 mt-2'; }
    else toast(msg, 'error');
  };
  if (!email || !pass) return fail('Enter your email and password.');
  const matches = DB.users.filter(x => (x.email || '').toLowerCase() === email);
  if (!matches.length) {
    return fail('No ' + (S.loginRole === 'super' ? 'Super Admin' : S.loginRole === 'admin' ? 'Business Admin' : 'Cashier') + ' account with that email.');
  }
  let u = matches.find(x => x.password === pass && x.role === S.loginRole);
  if (!u) u = matches.find(x => x.password === pass);
  if (!u) return fail('Wrong password.');
  if (u.status !== 'active') return fail('This account has been stopped. Contact the shop owner.');
  if (u.shopId) {
    const sh = shopById(u.shopId);
    if (!sh) return fail('This account is not linked to a shop.');
    if (sh.status === 'suspended') return fail('This shop has been stopped by ShopSmart. Contact support.');
  }
  loginAs(u);
}
function fillDemoLogin(d) {
  S.loginRole = d.role || S.loginRole;
  S.loginError = '';
  S.demoFill = { email: d.email, pass: d.pass, auto: true };
  render();

function doRegister() {
  const v = id => (document.getElementById(id).value || '').trim();
  const shopName = v('reg-shop'), owner = v('reg-owner'), phone = v('reg-phone');
  const email = v('reg-email').toLowerCase(), pass = v('reg-pass');
  const location = v('reg-location'), type = v('reg-type'), plan = v('reg-plan');
  const fail = m => { S.regError = m; render(); };
  if (!shopName || !owner || !phone || !email || !pass || !location) return fail('Please fill in all required fields.');
  if (email.indexOf('@') < 1) return fail('Please enter a valid email address.');
  if (pass.length < 6) return fail('Password must be at least 6 characters.');
  if (DB.users.some(u => u.email.toLowerCase() === email)) return fail('That email is already registered. Try logging in.');

  const words = shopName.split(/\s+/);
  const prefix = words.slice(0, 3).map(w => w.charAt(0).toUpperCase()).join('') || 'SHOP';
  const shop = {
    id: uid('sh'), name: shopName, owner: owner, phone: phone, email: email, password: pass,
    location: location, type: type, plan: plan, status: 'trial', preStatus: null,
    createdAt: new Date().toISOString(), trialEndsAt: new Date(Date.now() + 14 * 864e5).toISOString(),
    logo: null, tin: '', receiptMsg: 'Thank you for shopping with us. Karibu tena!',
    currency: 'UGX', lowStockLevel: 10, prefix: prefix, seq: 0
  };
  const admin = {
    id: uid('u'), shopId: shop.id, name: owner, email: email, password: pass,
    role: 'admin', phone: phone, status: 'active'
  };
  DB.shops.push(shop);
  DB.users.push(admin);
  persist();
  S.regError = '';
  loginAs(admin);
  toast('Shop created! Your 14-day free trial has started.');
}

/* ================= Super Admin page ================= */
function marketAgg() {
  const from = dayKey(shiftDay(-6));
  const qtyByName = {}, prevQty = {}, lowCount = {};
  DB.sales.forEach(function (s) {
    if (s.day < from) return;
    const sh = shopById(s.shopId);
    if (!sh || sh.status === 'suspended') return;
    s.items.forEach(function (it) {
      qtyByName[it.name] = (qtyByName[it.name] || 0) + it.qty;
    });
  });
  const prevFrom = dayKey(shiftDay(-13)), prevTo = dayKey(shiftDay(-7));
  DB.sales.forEach(function (s) {
    if (s.day < prevFrom || s.day > prevTo) return;
    const sh = shopById(s.shopId);
    if (!sh || sh.status === 'suspended') return;
    s.items.forEach(function (it) { prevQty[it.name] = (prevQty[it.name] || 0) + it.qty; });
  });
  DB.products.forEach(function (p) {
    const sh = shopById(p.shopId);
    if (!sh || sh.status === 'suspended') return;
    if (p.stock <= sh.lowStockLevel) lowCount[p.name] = (lowCount[p.name] || 0) + 1;
  });
  const top = Object.keys(qtyByName).map(n => ({ name: n, qty: qtyByName[n] }))
    .sort((a, b) => b.qty - a.qty).slice(0, 6);
  const rising = Object.keys(qtyByName)
    .map(n => ({ name: n, now: qtyByName[n], before: prevQty[n] || 0 }))
    .filter(x => x.now > x.before && x.now >= 3)
    .map(x => ({ name: x.name, now: x.now, before: x.before, pct: x.before === 0 ? 100 : Math.round((x.now - x.before) / x.before * 100) }))
    .sort((a, b) => b.pct - a.pct).slice(0, 5);
  const finishing = Object.keys(lowCount).map(n => ({ name: n, shops: lowCount[n] }))
    .sort((a, b) => b.shops - a.shops).slice(0, 6);
  const avgOf = key => {
    const rows = DB.products.filter(p => p.name.toLowerCase().indexOf(key) === 0 ||
      p.name.toLowerCase().indexOf(' ' + key) > -1 || p.name.toLowerCase().indexOf(key) > -1);
    if (!rows.length) return null;
    const retail = rows.reduce((t, p) => t + p.retail, 0) / rows.length;
    const sold = [];
    DB.sales.forEach(s => { if (s.day >= from) s.items.forEach(it => { if (it.name.toLowerCase().indexOf(key) > -1) sold.push(it.price); }); });
    const soldAvg = sold.length ? sold.reduce((a, b) => a + b, 0) / sold.length : retail;
    return { retail: Math.round(retail), sold: Math.round(soldAvg) };
  };
  return {
    top, rising, finishing,
    prices: [
      { key: 'Sugar', label: 'Sugar (avg)', v: avgOf('sugar') },
      { key: 'Rice', label: 'Rice (avg)', v: avgOf('rice') },
      { key: 'Cooking Oil', label: 'Cooking Oil (avg)', v: avgOf('cooking oil') }
    ].filter(x => x.v)
  };
}

  const trial = DB.shops.filter(s => s.status === 'trial');
  const mrr = sum(active, s => PLANS[s.plan].price);
  const k = dayKey();
  let todaySales = 0;
  DB.sales.forEach(s => { if (s.day === k) todaySales += s.total; });
  const m = marketAgg();

  const stat = (label, value, sub, accent) =>

    stat('Money from Subscriptions', fmt(mrr), 'UGX this month') +
    stat('Sales Today (all shops)', fmt(todaySales), 'UGX across the platform') +
    '</div>';

  /* shops table */
  h += '<div class="card overflow-hidden"><div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">' +
    '<h2 class="font-bold text-slate-800">All shops</h2>' +

/* ================= Owner dashboard ================= */
function barChart(data) {
  const max = Math.max(1, ...data.map(d => d.total));
  let bars = '';
  data.forEach(function (d) {
    const pct = Math.round((d.total / max) * 100);
    bars += '<div class="flex flex-col items-center gap-1 flex-1 min-w-0">' +
      '<div class="text-[10px] font-bold text-slate-500 truncate w-full text-center">' + (d.total ? fmt(d.total) : '') + '</div>' +
      '<div class="w-full bg-brand-100 rounded-t-md flex items-end" style="height:90px">' +
      '<div class="w-full bg-gradient-to-t from-brand-600 to-brand-400 rounded-t-md" style="height:' + Math.max(pct, 3) + '%"></div>' +
      '</div>' +
      '<div class="text-[10px] font-semibold text-slate-400">' + esc(d.label) + '</div></div>';
  });
  return '<div class="flex gap-2 items-end">' + bars + '</div>';
}
function pageDashboard() {
  const sh = myShop();
  const st = dashStats();
  const week = last7(sh.id);
  const from = dayKey(shiftDay(-6));
  const kpi = (label, value, sub, tone) =>
    '<div class="kpi"><div class="kpi-label">' + esc(label) + '</div>' +
    '<div class="kpi-value ' + (tone || '') + '">' + value + '</div>' +
    '<div class="kpi-sub">' + esc(sub) + '</div></div>';

  let h = '<div class="space-y-6">';
  const latestBc = DB.broadcasts.length ? DB.broadcasts[DB.broadcasts.length - 1] : null;
  h += '<div class="flex flex-wrap items-center justify-between gap-3">' +
    '<div><h2 class="text-lg font-black text-slate-800">Hello, ' + esc(S.user.name.split(' ')[0]) + ' 👋</h2>' +
    '<p class="text-sm text-slate-500">' + esc(sh.name) + ' &middot; ' +
    esc(sh.status === 'trial' ? 'Free trial ends ' + fmtShort(dayKey(new Date(sh.trialEndsAt))) : PLANS[sh.plan].name + ' plan') + '</p></div>' +
    '<button class="btn-primary" data-action="nav" data-page="pos">🛒 New sale</button></div>';
  if (latestBc) {
    h += '<div class="bg-brand-50 border border-brand-100 rounded-xl px-4 py-3 flex gap-3 items-start">' +
      '<span class="text-lg">✉️</span><div><div class="text-xs font-bold uppercase tracking-wide text-brand-700">Message from ShopSmart</div>' +
      '<div class="text-sm text-slate-700 mt-0.5">' + esc(latestBc.message) + '</div>' +
      '<div class="text-xs text-slate-400 mt-1">' + esc(new Date(latestBc.date).toLocaleString('en-GB')) + '</div></div></div>';
  }
  h += '<div class="grid grid-cols-2 lg:grid-cols-5 gap-4">' +
    kpi('Sales Today', fmt(st.sales), st.count + ' sales · UGX') +
    kpi('Profit Today', fmt(st.profit), 'after costs & expenses', st.profit >= 0 ? 'text-brand-700' : 'text-red-600') +
    kpi('Products Low in Stock', fmt(st.low.length), 'at or below ' + sh.lowStockLevel + ' units', st.low.length ? 'text-amber-600' : '') +
    kpi('Customers Owe Me', fmt(st.owed), 'UGX outstanding', 'text-red-600') +
    kpi('Cash in Hand', fmt(st.cash), 'UGX (opening + sales − expenses)') +
    '</div>';
  h += '<div class="grid gap-4 lg:grid-cols-3">';
  h += '<div class="card p-4 lg:col-span-2"><div class="flex items-center justify-between mb-3">' +
    '<h3 class="font-bold text-slate-800 text-sm">Sales — last 7 days</h3>' +
    '<span class="text-xs text-slate-500 font-semibold">Total: ' + fmt(sum(week, w => w.total)) + ' UGX</span></div>' +
    barChart(week) + '</div>';

  const sellWell = {};
  DB.sales.forEach(s => {
    if (s.shopId !== sh.id || s.day < from) return;
    s.items.forEach(it => {
      if (!sellWell[it.name]) sellWell[it.name] = { name: it.name, qty: 0, value: 0 };
      sellWell[it.name].qty += it.qty;
      sellWell[it.name].value += it.qty * it.price;
    });
  });
  const wellList = Object.keys(sellWell).map(n => sellWell[n]).sort((a, b) => b.qty - a.qty).slice(0, 5);

      '<li class="flex items-center justify-between text-sm gap-2"><span class="truncate text-slate-700">' + esc(x.name) + '</span>' +
      '<span class="badge bg-brand-100 text-brand-800 whitespace-nowrap">' + fmt(x.qty) + ' sold</span></li>').join('')
      : '<li class="text-xs text-slate-400">No sales in the last 7 days yet.</li>') +
    '</ul></div>';
  h += '</div>';
  h += DASHBOARD_BOTTOM(sh, st);
  h += '</div>';
  return h;
}

/* ================= POS / Selling page ================= */
function posProducts() {
  const sh = myShop();
  const q = S.posQ.trim().toLowerCase();
  return productsOf(sh.id).filter(function (p) {
    if (S.posType !== 'All' && p.type !== S.posType) return false;
    if (q && p.name.toLowerCase().indexOf(q) === -1 && String(p.barcode).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}
function linePrice(p, qty) { return qty >= 10 ? p.wholesale : p.retail; }
function cartTotals() {
  const sub = sum(S.cart, l => l.price * l.qty);
  const disc = Math.min(S.discount || 0, sub);
  return { sub, disc, total: sub - disc };
}

      '<span>Change</span><span>' + fmt(Math.max(0, paid - t.total)) + ' UGX</span></div>';
  }
  if (S.method === 'Credit') {
    h += '<div><label class="text-xs font-bold text-slate-600">Customer (who will pay later) *</label>' +
      '<select class="input py-1.5 mt-1" data-change="credit-cust">' +
      '<option value="">— choose customer —</option>' +
      custs.map(c => '<option value="' + c.id + '"' + (S.creditCust === c.id ? ' selected' : '') + '>' +
        esc(c.name) + ' — owes ' + fmt(c.owed) + '</option>').join('') +

  h += '</div></div>';
  return h;
}

function refreshPOS() {

  if (grid) grid.innerHTML = posGridHTML();

function addToCart(id) {
  const p = DB.products.find(x => x.id === id);
  if (!p) return;
  if (p.stock <= 0) { toast('"' + p.name + '" is out of stock.', 'error'); return; }
  const line = S.cart.find(l => l.pid === id);
  if (line) {
    if (line.qty + 1 > p.stock) { toast('Only ' + p.stock + ' in stock for "' + p.name + '".', 'error'); return; }
    line.qty += 1;
    line.price = linePrice(p, line.qty);
  } else {
    S.cart.push({ pid: p.id, name: p.name, qty: 1, price: linePrice(p, 1), buy: p.buy, retail: p.retail, wholesale: p.wholesale });
  }
  refreshPOS();
}
function changeQty(i, d) {
  const l = S.cart[i];
  if (!l) return;
  const p = DB.products.find(x => x.id === l.pid);
  const next = l.qty + d;
  if (next <= 0) { S.cart.splice(i, 1); }
  else {
    if (p && next > p.stock) { toast('Only ' + p.stock + ' in stock.', 'error'); return; }
    l.qty = next;
    if (p) l.price = linePrice(p, l.qty);
  }
  refreshPOS();
}
function completeSale() {
  if (!S.cart.length) { toast('Cart is empty.', 'error'); return; }
  const sh = myShop();
  const t = cartTotals();

  for (const l of S.cart) {
    const p = DB.products.find(x => x.id === l.pid);
    if (!p || p.stock < l.qty) { toast('Not enough stock for "' + l.name + '".', 'error'); return; }
  }
  if (S.method === 'Credit' && !S.creditCust) { toast('Choose the customer for credit sales.', 'error'); return; }
  let paid = t.total, change = 0;
  if (S.method === 'Cash') {
    paid = S.paid === '' ? t.total : Number(S.paid);
    if (isNaN(paid) || paid < t.total) { toast('Amount paid is less than the total.', 'error'); return; }
    change = paid - t.total;
  } else if (S.method === 'Credit') {
    paid = 0;
  }

  sh.seq = (sh.seq || 0) + 1;
  const now = new Date();
  const sale = {
    id: uid('s'), shopId: sh.id, day: dayKey(now), ts: now.toISOString(),
    receipt: sh.prefix + '-' + pad4(sh.seq),
    cashierId: S.user.id, cashier: S.user.name,
    items: S.cart.map(l => ({ pid: l.pid, name: l.name, qty: l.qty, price: l.price, buy: l.buy })),
    subtotal: t.sub, discount: t.disc, total: t.total,
    method: S.method, paid: paid, change: change,
    customerId: S.method === 'Credit' ? S.creditCust : null
  };
  /* stock down */
  sale.items.forEach(function (it) {
    const p = DB.products.find(x => x.id === it.pid);
    if (p) p.stock = Math.max(0, p.stock - it.qty);
  });
  DB.sales.push(sale);
  if (sale.method === 'Credit' && sale.customerId) {
    const c = DB.customers.find(x => x.id === sale.customerId);
    if (c) {
      c.owed += t.total;
      c.totalBought += t.total;
      if (!c.due) c.due = dayKey(shiftDay(7));
    }
  }
  persist();

  S.lastSale = sale.id;
  S.cart = []; S.discount = 0; S.paid = ''; S.method = 'Cash'; S.creditCust = '';
  refreshPOS();
  toast('Sale completed — stock updated.');
  showReceipt(sale.id);
}

/* ================= Reports page ================= */
const REP_TABS = [
  { id: 'sales', label: 'Sales Report' },
  { id: 'stock', label: 'Stock Report' },
  { id: 'profit', label: 'Profit Report' },
  { id: 'debt', label: 'People Who Owe Me' },
  { id: 'supplier', label: 'Supplier Report' }
];
function repRange() {
  let from = S.repFrom || dayKey(shiftDay(-29));
  let to = S.repTo || dayKey();
  if (to < from) { const t = from; from = to; to = t; }
  return { from, to };
}
function repData() {
  const sh = myShop();
  const r = repRange();
  if (S.repTab === 'sales') {
    const rows = salesBetween(sh.id, r.from, r.to).slice().sort((a, b) => (b.ts > a.ts ? 1 : -1));
    return {
      title: 'Sales Report (' + fmtDate(r.from) + ' – ' + fmtDate(r.to) + ')',
      headers: ['Date', 'Receipt', 'Cashier', 'Items', 'Method', 'Total', 'Profit'],
      rows: rows.map(s => [fmtDate(s.day), s.receipt, s.cashier, s.items.reduce((t, i) => t + i.qty, 0), s.method, fmt(s.total), fmt(saleProfit(s))]),
      footers: ['', 'TOTAL (' + rows.length + ' sales)', '', '', '', fmt(sum(rows, s => s.total)), fmt(sum(rows, saleProfit))],
      csvFoot: ['TOTAL', '', '', '', sum(rows, s => s.total), sum(rows, saleProfit)]
    };
  }
  if (S.repTab === 'stock') {
    const list = productsOf(sh.id);
    return {
      title: 'Stock Report (as at ' + fmtDate(dayKey()) + ')',
      headers: ['Product', 'Type', 'Barcode', 'Stock', 'Buying', 'Retail', 'Stock value'],
      rows: list.map(p => [p.name, p.type, p.barcode, p.stock, fmt(p.buy), fmt(p.retail), fmt(p.buy * p.stock)]),
      footers: ['TOTAL', '', '', sum(list, p => p.stock), '', '', fmt(sum(list, p => p.buy * p.stock))],
      csvFoot: ['TOTAL', '', '', sum(list, p => p.stock), '', '', sum(list, p => p.buy * p.stock)]
    };
  }
  if (S.repTab === 'profit') {
    const rows = [];
    let d0 = new Date(r.from + 'T00:00:00'), d1 = new Date(r.to + 'T00:00:00');
    for (let d = new Date(d0); d <= d1; d.setDate(d.getDate() + 1)) {
      const k = dayKey(d);
      const ss = salesOn(sh.id, k);
      if (!ss.length && !expensesOn(sh.id, k).length) continue;
      const sales = sum(ss, s => s.total);
      const cogs = sum(ss, saleCost);
      const exp = sum(expensesOn(sh.id, k), e => e.amount);
      rows.push([fmtDate(k), fmt(sales), fmt(cogs), fmt(exp), fmt(sales - cogs - exp)]);
    }
    const salesT = rows.reduce((t, x) => t + Number(String(x[1]).replace(/,/g, '')), 0);
    const cogsT = rows.reduce((t, x) => t + Number(String(x[2]).replace(/,/g, '')), 0);
    const expT = rows.reduce((t, x) => t + Number(String(x[3]).replace(/,/g, '')), 0);
    return {
      title: 'Profit Report (' + fmtDate(r.from) + ' – ' + fmtDate(r.to) + ')',
      headers: ['Date', 'Sales', 'Cost of goods', 'Expenses', 'Net profit'],
      rows: rows,
      footers: ['TOTAL', fmt(salesT), fmt(cogsT), fmt(expT), fmt(salesT - cogsT - expT)],
      csvFoot: ['TOTAL', salesT, cogsT, expT, salesT - cogsT - expT]
    };
  }
  if (S.repTab === 'debt') {
    const list = customersOf(sh.id).filter(c => c.owed > 0).sort((a, b) => b.owed - a.owed);
    return {
      title: 'People Who Owe Me (as at ' + fmtDate(dayKey()) + ')',
      headers: ['Customer', 'Phone', 'Total bought', 'Owes', 'Due date'],
      rows: list.map(c => [c.name, c.phone, fmt(c.totalBought), fmt(c.owed), c.due ? fmtDate(c.due) : '—']),
      footers: ['TOTAL (' + list.length + ' people)', '', '', fmt(sum(list, c => c.owed)), ''],
      csvFoot: ['TOTAL', '', sum(list, c => c.totalBought), sum(list, c => c.owed), '']
    };
  }
  /* supplier */
  const sups = suppliersOf(sh.id);
  const purs = DB.purchases.filter(p => p.shopId === sh.id);
  return {
    title: 'Supplier Report (as at ' + fmtDate(dayKey()) + ')',
    headers: ['Supplier', 'Phone', 'Purchases', 'Total cost', 'Paid', 'Balance owed'],
    rows: sups.map(function (s) {
      const pp = purs.filter(p => p.supplierId === s.id);
      return [s.name, s.phone, pp.length, fmt(sum(pp, p => p.cost)), fmt(sum(pp, p => p.paid)), fmt(s.owed)];
    }),
    footers: ['TOTAL', '', purs.length, fmt(sum(purs, p => p.cost)), fmt(sum(purs, p => p.paid)), fmt(sum(sups, s => s.owed))],
    csvFoot: ['TOTAL', '', purs.length, sum(purs, p => p.cost), sum(purs, p => p.paid), sum(sups, s => s.owed)]
  };
}

  openModal(purchaseFormHTML());
  setTimeout(() => {
    const prod = document.getElementById('pu-prod');
    const unit = document.getElementById('pu-unit');
    if (prod && unit) {
      const p = DB.products.find(x => x.id === prod.value);
      if (p) unit.value = p.buy;
      updatePurchaseBalance();
    }
  }, 40);
};
ACTIONS['create-purchase'] = () => {
  const v = id => document.getElementById(id).value.trim();
  const supId = v('pu-sup'), prodId = v('pu-prod'), day = v('pu-date') || dayKey();
  const qty = Number(v('pu-qty')), unit = Number(v('pu-unit')), paid = Number(v('pu-paid'));
  const err = document.getElementById('pu-error');
  const fail = m => { if (err) err.textContent = m; };
  if (!supId || !prodId) return fail('Supplier and product are required.');
  if (isNaN(qty) || qty < 1) return fail('Quantity must be 1 or more.');
  if (isNaN(unit) || unit < 0) return fail('Unit cost must be 0 or more.');
  if (isNaN(paid) || paid < 0) return fail('Paid amount must be 0 or more.');
  const cost = qty * unit;
  if (paid > cost) return fail('Paid amount cannot be more than the cost.');
  const sup = DB.suppliers.find(x => x.id === supId);
  const prod = DB.products.find(x => x.id === prodId);
  DB.purchases.push({
    id: uid('pu'), shopId: myShop().id, day: day, supplierId: sup.id, supplierName: sup.name,
    productId: prod.id, productName: prod.name, qty: qty, cost: cost, paid: paid, balance: cost - paid
  });
  sup.owed += (cost - paid);
  prod.stock += qty;               /* stock up automatically */
  persist(); closeModal(); render();
  toast('Purchase saved — stock of ' + prod.name + ' is now ' + prod.stock + '.');
};

  persist(); closeModal(); render();
  toast('Payment of ' + fmt(amt) + ' recorded. Balance: ' + fmt(c.owed) + '.');
};

/* expenses */
ACTIONS['add-expense'] = () => {
  const cat = document.getElementById('ex-cat').value;
  const amount = Number(document.getElementById('ex-amount').value);
  const day = document.getElementById('ex-date').value || dayKey();
  const note = document.getElementById('ex-note').value.trim();
  const err = document.getElementById('ex-error');
  if (isNaN(amount) || amount <= 0) { if (err) err.textContent = 'Enter an amount greater than 0.'; return; }
  DB.expenses.push({ id: uid('ex'), shopId: myShop().id, day: day, cat: cat, amount: amount, note: note });
  persist(); render();
  toast(cat + ' expense of ' + fmt(amount) + ' added.');
};
ACTIONS['delete-expense'] = d => {
  confirmModal('Delete expense?', 'Remove this expense?', function () {
    DB.expenses = DB.expenses.filter(x => x.id !== d.id);
    persist(); render();
    toast('Expense deleted.', 'info');
  });
};
ACTIONS['save-opening'] = () => {
  const v = Number(document.getElementById('opening-input').value);
  if (isNaN(v) || v < 0) { toast('Enter a valid amount.', 'error'); return; }
  DB.openings[myShop().id + '|' + dayKey()] = v;
  persist(); render();
  toast('Opening cash saved.');
};

/* reports */
ACTIONS['rep-tab'] = d => { S.repTab = d.t; render(); };
ACTIONS['rep-print'] = () => {
  const d = repData();
  doPrint(reportPrintHTML(d.title, myShop(), d.headers, d.rows, d.footers));
};
ACTIONS['rep-pdf'] = () => {
  const d = repData();
  toast('Choose "Save as PDF" in the print dialog.', 'info');
  doPrint(reportPrintHTML(d.title, myShop(), d.headers, d.rows, d.footers));
};
ACTIONS['rep-excel'] = () => {
  const d = repData();
  const rows = d.rows.slice();
  if (d.csvFoot) rows.push(d.csvFoot);
  const csv = tableToCSV(d.headers, rows);
  const sh = myShop();
  const name = (sh ? sh.name.replace(/[^a-z0-9]+/gi, '_') : 'ShopSmart') + '_' + S.repTab + '_' + dayKey() + '.csv';
  downloadFile(name, csv, 'text/csv;charset=utf-8');
  toast('Excel file downloaded (CSV opens in Excel).');
};

/* staff */
ACTIONS['add-cashier'] = () => openModal(cashierFormHTML(null));
ACTIONS['edit-staff'] = d => openModal(cashierFormHTML(DB.users.find(x => x.id === d.id)));
ACTIONS['create-staff'] = () => {
  const v = readStaffForm(true);
  if (!v) return;
  const sh = myShop();
  if (DB.users.some(u => u.email.toLowerCase() === v.email)) {
    document.getElementById('stf-error').textContent = 'That email is already used.';
    return;
  }
  DB.users.push({
    id: uid('u'), shopId: sh.id, name: v.name, phone: v.phone, email: v.email,
    password: v.pass, role: 'cashier', status: 'active'
  });
  persist(); closeModal(); render();
  toast('Cashier added. They can now login and sell.');
};
ACTIONS['save-staff'] = d => {
  const v = readStaffForm(false);
  if (!v) return;
  const u = DB.users.find(x => x.id === d.id);
  if (DB.users.some(x => x.id !== d.id && x.email.toLowerCase() === v.email)) {
    document.getElementById('stf-error').textContent = 'That email is already used.';
    return;
  }
  u.name = v.name; u.phone = v.phone; u.email = v.email;
  persist(); closeModal(); render();
  toast('Cashier updated.');
};
ACTIONS['staff-password'] = d => passwordModal(d.id);
ACTIONS['save-password'] = d => {
  const val = (document.getElementById('pw-new') || {}).value || '';
  const err = document.getElementById('pw-error');
  if (val.length < 6) { if (err) err.textContent = 'Password must be at least 6 characters.'; return; }
  const u = DB.users.find(x => x.id === d.id);
  u.password = val;
  persist(); closeModal();
  toast('Password changed for ' + u.name + '.');
};
ACTIONS['staff-toggle'] = d => {
  const u = DB.users.find(x => x.id === d.id);
  if (!u) return;
  if (u.id === S.user.id) { toast('You cannot stop your own account.', 'error'); return; }
  u.status = u.status === 'active' ? 'stopped' : 'active';
  persist(); render();
  toast(u.name + ' is now ' + u.status + '.', 'info');
};
ACTIONS['staff-delete'] = d => {
  const u = DB.users.find(x => x.id === d.id);
  if (!u) return;
  if (u.id === S.user.id) { toast('You cannot delete your own account.', 'error'); return; }
  confirmModal('Delete staff member?', 'Delete "' + u.name + '"? Their past sales stay in reports.', function () {
    DB.users = DB.users.filter(x => x.id !== d.id);
    persist(); render();
    toast('Staff member deleted.', 'info');
  });
};

/* settings */
ACTIONS['save-settings'] = (d, el, ev) => {
  ev.preventDefault();
  const sh = myShop();
  const v = id => document.getElementById(id).value.trim();
  const name = v('set-name');
  if (!name) { document.getElementById('set-error').textContent = 'Shop name is required.'; return; }
  sh.name = name;
  sh.phone = v('set-phone');
  sh.location = v('set-location');
  sh.tin = v('set-tin');
  sh.currency = document.getElementById('set-currency').value;
  sh.lowStockLevel = Math.max(1, Number(v('set-low')) || 10);
  sh.receiptMsg = document.getElementById('set-msg').value.trim() || 'Thank you for shopping with us!';
  sh.type = document.getElementById('set-type').value;
  persist(); render();
  toast('Settings saved.');
};

/* ================= Event wiring ================= */
function updatePurchaseBalance() {
  const el = document.getElementById('pu-balance');
  if (!el) return;
  const qty = Number((document.getElementById('pu-qty') || {}).value || 0);
  const unit = Number((document.getElementById('pu-unit') || {}).value || 0);
  const paid = Number((document.getElementById('pu-paid') || {}).value || 0);
  const bal = Math.max(0, (isNaN(qty) ? 0 : qty) * (isNaN(unit) ? 0 : unit) - (isNaN(paid) ? 0 : paid));
  el.textContent = fmt(bal) + ' ' + (myShop() ? myShop().currency : 'UGX');
}
function handleLogoFile(file) {
  if (!file) return;
  if (file.size > 700 * 1024) { toast('Image too big — please choose a smaller logo (under 700KB).', 'error'); return; }
  const reader = new FileReader();
  reader.onload = function (e) {
    const img = new Image();
    img.onload = function () {
      /* downscale to 160px so LocalStorage stays small */
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const ratio = Math.min(size / img.width, size / img.height);
      const w = img.width * ratio, h = img.height * ratio;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      myShop().logo = canvas.toDataURL('image/png');
      persist(); render();
      toast('Logo updated — it will print on your receipts.');
    };
    img.onerror = function () { toast('Could not read that image.', 'error'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

document.addEventListener('click', function (ev) {
  const target = ev.target;
  const el = target.closest('[data-action]');
  if (!el) return;
  // Ignore clicks on form controls (input/textarea/select) so typing in forms isn't hijacked by submit actions
  const tag = target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const name = el.getAttribute('data-action');
  const fn = ACTIONS[name];
  if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  const d = {};
  for (const a of el.attributes) {
    if (a.name.indexOf('data-') === 0 && a.name !== 'data-action') {
      d[a.name.slice(5).replace(/-([a-z])/g, (m, c) => c.toUpperCase())] = a.value;
    }
  }
  fn(d, el, ev);
});

document.addEventListener('change', function (ev) {
  const el = ev.target;
  const name = el.getAttribute && el.getAttribute('data-change');
  if (!name) return;
  if (name === 'pos-search') { S.posQ = el.value; refreshPOS(); focusBack(el); }
  else if (name === 'prod-search') { S.prodQ = el.value; const t = document.getElementById('prod-table'); if (t) t.innerHTML = productsTableHTML(); focusBack(el); }
  else if (name === 'discount') { S.discount = Math.max(0, Number(el.value) || 0); refreshPOSKeepFocus('discount-input'); }
  else if (name === 'paid') { S.paid = el.value; refreshPOSKeepFocus('paid-input'); }
  else if (name === 'credit-cust') { S.creditCust = el.value; refreshPOS(); }
  else if (name === 'pu-calc') { updatePurchaseBalance(); }
  else if (name === 'rep-from') { S.repFrom = el.value; render(); }
  else if (name === 'rep-to') { S.repTo = el.value; render(); }
  else if (name === 'logo-file') { handleLogoFile(el.files && el.files[0]); }
});
/* live search as you type (input event, keeps focus) */
document.addEventListener('input', function (ev) {
  const el = ev.target;
  const name = el.getAttribute && el.getAttribute('data-change');
  if (name === 'pos-search') { S.posQ = el.value; const g = document.getElementById('pos-grid'); if (g) g.innerHTML = posGridHTML(); }
  else if (name === 'prod-search') { S.prodQ = el.value; const t = document.getElementById('prod-table'); if (t) t.innerHTML = productsTableHTML(); }
  else if (name === 'pu-calc') { updatePurchaseBalance(); }
  else if (name === 'discount') {
    S.discount = Math.max(0, Number(el.value) || 0);
    const panel = document.getElementById('cart-panel');
    if (panel) {
      const pos = el.selectionStart;
      panel.innerHTML = cartPanelHTML();
      const again = document.getElementById('discount-input');
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) { } }
    }
  } else if (name === 'paid') {
    S.paid = el.value;
    const panel = document.getElementById('cart-panel');
    if (panel) {
      const pos = el.selectionStart;
      panel.innerHTML = cartPanelHTML();
      const again = document.getElementById('paid-input');
      if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) { } }
    }
  }
});
function focusBack(el) {
  const id = el.id;
  setTimeout(function () {
    const again = document.getElementById(id);
    if (again) { again.focus(); const v = again.value; try { again.setSelectionRange(v.length, v.length); } catch (e) { } }
  }, 0);
}
function refreshPOSKeepFocus(inputId) {
  const panel = document.getElementById('cart-panel');
  if (!panel) return;
  const el = document.getElementById(inputId);
  const pos = el && el.selectionStart;
  panel.innerHTML = cartPanelHTML();
  const again = document.getElementById(inputId);
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) { } }
}
document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') closeModal();
  if (ev.key === 'Enter' && ev.target && ev.target.id === 'login-email') {
    ev.preventDefault();
    doLogin();
  }
});

/* ================= Boot ================= */
(function boot() {
  loadDB();
  try {
    const sid = localStorage.getItem(SESSION_KEY);
    if (sid) {
      const u = DB.users.find(x => x.id === sid);
      if (u && u.status === 'active') {
        S.user = u;
        S.page = u.role === 'super' ? 'super' : u.role === 'cashier' ? 'pos' : 'dashboard';
      } else {
        localStorage.removeItem(SESSION_KEY);
      }
    }
  } catch (e) { }
  render();
})();
</script>
