      const paidAmt = Math.min(25000, custs[0].owed);
      custs[0].owed -= paidAmt;
      db.debtPayments.push({ id: uid('dp'), shopId: sh.id, customerId: custs[0].id, day: dayKey(shiftDay(-2)), amount: paidAmt });
    }
  });

  db.broadcasts.push({
    id: uid('bc'), date: new Date(now.getTime() - 2 * 864e5).toISOString(),
    message: 'Welcome to ShopSmart! Wholesale prices now apply automatically when a customer buys 10 or more of an item. Karibu sana!'
  });
}

function toast(msg, kind) {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'rounded-lg px-4 py-3 text-sm font-semibold shadow-lg ' +
    (kind === 'error' ? 'bg-red-600 text-white' : kind === 'info' ? 'bg-slate-800 text-white' : 'bg-brand-600 text-white');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function doPrint(html) {

}
function downloadFile(name, content, mime) {
  const blob = new Blob(['\ufeff' + content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function tableToCSV(headers, rows) {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  return [headers.map(q).join(',')]
    .concat(rows.map(r => r.map(q).join(',')))
    .join('\r\n');
}

/* ================= Router / render ================= */
const HOME_TITLES = ['home', 'register'];
const ADMIN_PAGES = ['dashboard', 'analytics', 'pos', 'products', 'suppliers', 'customers', 'expenses', 'reports', 'staff', 'settings'];

function render() {
  const app = document.getElementById('app');
  if (!S.user) {
    app.innerHTML = S.page === 'register' ? pageRegister() : pageHome();
    afterRender();
    return;
  }
  // role guards
  if (S.user.role === 'super' && S.page !== 'super') S.page = 'super';
  if (S.user.role === 'cashier' && S.page !== 'pos') S.page = 'pos';
  if (S.user.role === 'admin' && S.page === 'super') S.page = 'dashboard';
  if (S.user.role === 'admin' && ADMIN_PAGES.indexOf(S.page) === -1) S.page = 'dashboard';

  let content = '';
  switch (S.page) {
    case 'super': content = pageSuper(); break;
    case 'dashboard': content = pageDashboard(); break;
    case 'analytics': content = pageAnalytics(); break;
    case 'pos': content = pagePOS(); break;
    case 'products': content = pageProducts(); break;
    case 'suppliers': content = pageSuppliers(); break;
    case 'customers': content = pageCustomers(); break;
    case 'expenses': content = pageExpenses(); break;
    case 'reports': content = pageReports(); break;
    case 'staff': content = pageStaff(); break;
    case 'settings': content = pageSettings(); break;
    default: content = pageDashboard();
  }
  app.innerHTML = shell(content);
  afterRender();
}
function afterRender() {
  const focusId = S.focusNext;
  S.focusNext = null;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el.focus) { el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); }
  }
  const fill = S.demoFill;
  S.demoFill = null;
  if (fill) {
    const em = document.getElementById('login-email');
    const pw = document.getElementById('login-pass');
    if (em) em.value = fill.email || '';
    if (pw) pw.value = fill.pass || '';
    if (fill.auto) doLogin();
    else if (em) em.focus();
  }
}
function go(page) {
  S.page = page;
  S.menu = false;
  if (page === 'pos' && S.user && S.user.role !== 'admin') { /* keep cart */ }
  window.scrollTo(0, 0);
  render();
}
function loginAs(user) {
  S.user = user;
  try { localStorage.setItem(SESSION_KEY, user.id); } catch (e) { }
  S.page = user.role === 'super' ? 'super' : user.role === 'cashier' ? 'pos' : 'dashboard';
  S.cart = []; S.discount = 0; S.method = 'Cash'; S.paid = ''; S.creditCust = ''; S.creditPaid = '';
  render();
  toast('Welcome, ' + user.name + '!');
}
function logout() {
  S.user = null;
  try { localStorage.removeItem(SESSION_KEY); } catch (e) { }
  S.page = 'home';
  closeModal();
  render();
}
function doLogin() {
  loadDB();
  const email = (document.getElementById('login-email').value || '').trim().toLowerCase();
  const pass = document.getElementById('login-pass').value || '';
  const errEl = document.getElementById('login-error');
  const fail = function (msg) {
    S.loginError = msg;
    if (errEl) { errEl.textContent = msg; errEl.className = 'text-xs font-semibold text-red-600 mt-2'; }
    else toast(msg, 'error');
  };
  if (!email || !pass) return fail('Enter your email and password.');
  const matches = DB.users.filter(x => (x.email || '').toLowerCase() === email);
  if (!matches.length) {
    return fail('No ' + (S.loginRole === 'super' ? 'Super Admin' : S.loginRole === 'admin' ? 'Business Admin' : 'Cashier') + ' account with that email.');
  }
  let u = matches.find(x => x.password === pass && x.role === S.loginRole);
  if (!u) u = matches.find(x => x.password === pass);
  if (!u) return fail('Wrong password.');
  if (u.status !== 'active') return fail('This account has been stopped. Contact the shop owner.');
  if (u.shopId) {
    const sh = shopById(u.shopId);
    if (!sh) return fail('This account is not linked to a shop.');
    if (sh.status === 'suspended') return fail('This shop has been stopped by ShopSmart. Contact support.');
  }
  loginAs(u);
}
function fillDemoLogin(d) {
  S.loginRole = d.role || S.loginRole;
  S.loginError = '';
  S.demoFill = { email: d.email, pass: d.pass, auto: true };

  render();
}

function doRegister() {

function marketAgg() {
  const from = dayKey(shiftDay(-6));
  const qtyByName = {}, prevQty = {}, lowCount = {};
  DB.sales.forEach(function (s) {
    if (s.day < from) return;
    const sh = shopById(s.shopId);
    if (!sh || sh.status === 'suspended') return;
    s.items.forEach(function (it) {
      qtyByName[it.name] = (qtyByName[it.name] || 0) + it.qty;
    });
  });
  const prevFrom = dayKey(shiftDay(-13)), prevTo = dayKey(shiftDay(-7));
  DB.sales.forEach(function (s) {
    if (s.day < prevFrom || s.day > prevTo) return;
    const sh = shopById(s.shopId);
    if (!sh || sh.status === 'suspended') return;
    s.items.forEach(function (it) { prevQty[it.name] = (prevQty[it.name] || 0) + it.qty; });
  });
  DB.products.forEach(function (p) {
    const sh = shopById(p.shopId);
    if (!sh || sh.status === 'suspended') return;
    if (p.stock <= sh.lowStockLevel) lowCount[p.name] = (lowCount[p.name] || 0) + 1;
  });
  const top = Object.keys(qtyByName).map(n => ({ name: n, qty: qtyByName[n] }))
    .sort((a, b) => b.qty - a.qty).slice(0, 6);
  const rising = Object.keys(qtyByName)
    .map(n => ({ name: n, now: qtyByName[n], before: prevQty[n] || 0 }))
    .filter(x => x.now > x.before && x.now >= 3)
    .map(x => ({ name: x.name, now: x.now, before: x.before, pct: x.before === 0 ? 100 : Math.round((x.now - x.before) / x.before * 100) }))
    .sort((a, b) => b.pct - a.pct).slice(0, 5);
  const finishing = Object.keys(lowCount).map(n => ({ name: n, shops: lowCount[n] }))
    .sort((a, b) => b.shops - a.shops).slice(0, 6);
  const avgOf = key => {
    const rows = DB.products.filter(p => p.name.toLowerCase().indexOf(key) === 0 ||
      p.name.toLowerCase().indexOf(' ' + key) > -1 || p.name.toLowerCase().indexOf(key) > -1);
    if (!rows.length) return null;
    const retail = rows.reduce((t, p) => t + p.retail, 0) / rows.length;
    const sold = [];
    DB.sales.forEach(s => { if (s.day >= from) s.items.forEach(it => { if (it.name.toLowerCase().indexOf(key) > -1) sold.push(it.price); }); });
    const soldAvg = sold.length ? sold.reduce((a, b) => a + b, 0) / sold.length : retail;
    return { retail: Math.round(retail), sold: Math.round(soldAvg) };
  };
  return {
    top, rising, finishing,
    prices: [
      { key: 'Sugar', label: 'Sugar (avg)', v: avgOf('sugar') },
      { key: 'Rice', label: 'Rice (avg)', v: avgOf('rice') },
      { key: 'Cooking Oil', label: 'Cooking Oil (avg)', v: avgOf('cooking oil') }
    ].filter(x => x.v)
  };
}
function superShopStats(sh) {
  const today = dayKey();
  const from7 = dayKey(shiftDay(-6));
  const prods = productsOf(sh.id);
  let s7 = 0, tx7 = 0, todaySales = 0, txToday = 0, totalAll = 0, lastDay = '';
  DB.sales.forEach(function (s) {
    if (s.shopId !== sh.id) return;
    totalAll += s.total;
    if (s.day > lastDay) lastDay = s.day;
    if (s.day >= from7) { s7 += s.total; tx7 += 1; }
    if (s.day === today) { todaySales += s.total; txToday += 1; }
  });
  const low = prods.filter(p => p.stock > 0 && p.stock <= sh.lowStockLevel).length;
  const out = prods.filter(p => p.stock <= 0).length;
  const inStock = prods.filter(p => p.stock > sh.lowStockLevel).length;
  const stockVal = sum(prods, p => p.buy * p.stock);
  const qtyByName = {};
  DB.sales.forEach(function (s) {
    if (s.shopId !== sh.id || s.day < from7) return;
    s.items.forEach(it => { qtyByName[it.name] = (qtyByName[it.name] || 0) + it.qty; });
  });
  const topProd = Object.keys(qtyByName).map(n => ({ name: n, qty: qtyByName[n] })).sort((a, b) => b.qty - a.qty)[0] || null;
  let health = 'healthy', healthLabel = 'Healthy';
  if (!prods.length || out === prods.length) { health = 'empty'; healthLabel = 'No stock'; }
  else if (out > 0) { health = 'out'; healthLabel = out + ' out of stock'; }
  else if (low > 0) { health = 'low'; healthLabel = low + ' low'; }
  if (tx7 === 0 && health === 'healthy') { health = 'quiet'; healthLabel = 'No sales 7d'; }
  return { s7, tx7, todaySales, txToday, totalAll, lastDay, prods: prods.length, low, out, inStock, stockVal, topProd, health, healthLabel };
}
function superHealthBadge(st) {
  if (st.health === 'healthy') return '<span class="px-2 py-0.5 text-xs font-bold rounded-full bg-green-100 text-green-700">Healthy</span>';
  if (st.health === 'low') return '<span class="px-2 py-0.5 text-xs font-bold rounded-full bg-amber-100 text-amber-700">' + esc(st.healthLabel) + '</span>';
  if (st.health === 'out') return '<span class="px-2 py-0.5 text-xs font-bold rounded-full bg-red-100 text-red-700">' + esc(st.healthLabel) + '</span>';
  if (st.health === 'empty') return '<span class="px-2 py-0.5 text-xs font-bold rounded-full bg-red-100 text-red-700">No stock</span>';
  return '<span class="px-2 py-0.5 text-xs font-bold rounded-full bg-slate-200 text-slate-600">No sales 7d</span>';
}

function superFilteredShops() {
  if (S.supQ == null) S.supQ = '';
  if (!S.supStatus) S.supStatus = 'all';
  if (!S.supHealth) S.supHealth = 'all';
  if (!S.supSort) S.supSort = 'sales7_desc';
  const q = String(S.supQ || '').trim().toLowerCase();
  let list = DB.shops.map(s => ({ shop: s, st: superShopStats(s) }));
  list = list.filter(function (r) {
    const s = r.shop;
    if (S.supStatus !== 'all' && s.status !== S.supStatus) return false;
    if (S.supHealth === 'with_stock' && r.st.prods - r.st.out <= 0) return false;
    if (S.supHealth === 'no_stock' && !(r.st.prods === 0 || r.st.out === r.st.prods)) return false;
    if (S.supHealth === 'low' && r.st.low === 0) return false;
    if (S.supHealth === 'out' && r.st.out === 0) return false;
    if (S.supHealth === 'healthy' && r.st.health !== 'healthy') return false;
    if (S.supHealth === 'quiet' && r.st.tx7 !== 0) return false;
    if (S.supHealth === 'selling' && r.st.tx7 === 0) return false;
    if (q) {
      const hay = (s.name + ' ' + s.owner + ' ' + s.location + ' ' + s.email + ' ' + s.phone).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  const by = S.supSort;
  list.sort(function (a, b) {
    if (by === 'sales7_desc') return b.st.s7 - a.st.s7;
    if (by === 'sales7_asc') return a.st.s7 - b.st.s7;
    if (by === 'today_desc') return b.st.todaySales - a.st.todaySales;
    if (by === 'tx_desc') return b.st.tx7 - a.st.tx7;
    if (by === 'stock_desc') return (b.st.prods - b.st.out) - (a.st.prods - a.st.out);
    if (by === 'out_desc') return b.st.out - a.st.out;
    if (by === 'low_desc') return b.st.low - a.st.low;
    if (by === 'value_desc') return b.st.stockVal - a.st.stockVal;
    if (by === 'name_asc') return a.shop.name.localeCompare(b.shop.name);
    return b.st.s7 - a.st.s7;
  });
  return list;
}

function barChart(data) {
  const max = Math.max(1, ...data.map(d => d.total));
  let bars = '';
  data.forEach(function (d) {
    const pct = Math.round((d.total / max) * 100);
    bars += '<div class="flex flex-col items-center gap-1 flex-1 min-w-0">' +
      '<div class="text-[10px] font-bold text-slate-500 truncate w-full text-center">' + (d.total ? fmt(d.total) : '') + '</div>' +
      '<div class="w-full bg-brand-100 rounded-t-md flex items-end" style="height:90px">' +
      '<div class="w-full bg-gradient-to-t from-brand-600 to-brand-400 rounded-t-md" style="height:' + Math.max(pct, 3) + '%"></div>' +
      '</div>' +
      '<div class="text-[10px] font-semibold text-slate-400">' + esc(d.label) + '</div></div>';
  });
  return '<div class="flex gap-2 items-end">' + bars + '</div>';
}

    '</ul></div>';
  h += '</div>';

  return h;

function posProducts() {
  const sh = myShop();
  const q = S.posQ.trim().toLowerCase();
  return productsOf(sh.id).filter(function (p) {
    if (S.posType !== 'All' && p.type !== S.posType) return false;
    if (q && p.name.toLowerCase().indexOf(q) === -1 && String(p.barcode).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
}

}

function addToCart(id) {
  const p = DB.products.find(x => x.id === id);
  if (!p) return;
  if (p.stock <= 0) { toast('"' + p.name + '" is out of stock.', 'error'); return; }
  const line = S.cart.find(l => l.pid === id);
  if (line) {
    if (line.qty + 1 > p.stock) { toast('Only ' + p.stock + ' in stock for "' + p.name + '".', 'error'); return; }
    line.qty += 1;
    line.price = linePrice(p, line.qty);
  } else {
    S.cart.push({ pid: p.id, name: p.name, qty: 1, price: linePrice(p, 1), buy: p.buy, retail: p.retail, wholesale: p.wholesale });
  }
  refreshPOS();
}
function changeQty(i, d) {
  const l = S.cart[i];
  if (!l) return;
  const p = DB.products.find(x => x.id === l.pid);
  const next = l.qty + d;
  if (next <= 0) { S.cart.splice(i, 1); }
  else {
    if (p && next > p.stock) { toast('Only ' + p.stock + ' in stock.', 'error'); return; }
    l.qty = next;
    if (p) l.price = linePrice(p, l.qty);
  }
  refreshPOS();
}
function completeSale() {
  if (!S.cart.length) { toast('Cart is empty.', 'error'); return; }
  const sh = myShop();
  const t = cartTotals();

  for (const l of S.cart) {
    const p = DB.products.find(x => x.id === l.pid);
    if (!p || p.stock < l.qty) { toast('Not enough stock for "' + l.name + '".', 'error'); return; }
  }
  if (S.method === 'Credit' && !S.creditCust) { toast('Choose the customer for credit sales.', 'error'); return; }
  let paid = t.total, change = 0, balance = 0;
  if (S.method === 'Cash') {
    paid = S.paid === '' ? t.total : Number(S.paid);
    if (isNaN(paid) || paid < t.total) { toast('Amount paid is less than the total.', 'error'); return; }
    change = paid - t.total;
  } else if (S.method === 'Credit') {
    paid = S.creditPaid === '' ? 0 : Number(S.creditPaid);
    if (isNaN(paid) || paid < 0) { toast('Enter a valid amount paid now (0 or more).', 'error'); return; }
    if (paid > t.total) { toast('Paid now cannot be more than the total (' + fmt(t.total) + ').', 'error'); return; }
    balance = t.total - paid;
  } else {
    paid = t.total;
  }

  sh.seq = (sh.seq || 0) + 1;
  const now = new Date();
  const sale = {
    id: uid('s'), shopId: sh.id, day: dayKey(now), ts: now.toISOString(),
    receipt: sh.prefix + '-' + pad4(sh.seq),
    cashierId: S.user.id, cashier: S.user.name,
    items: S.cart.map(l => ({ pid: l.pid, name: l.name, qty: l.qty, price: l.price, buy: l.buy })),
    subtotal: t.sub, discount: t.disc, total: t.total,
    method: S.method, paid: paid, change: change, balance: balance,
    customerId: S.method === 'Credit' ? S.creditCust : null
  };
  /* stock down */
  sale.items.forEach(function (it) {
    const p = DB.products.find(x => x.id === it.pid);
    if (p) p.stock = Math.max(0, p.stock - it.qty);
  });
  DB.sales.push(sale);
  if (sale.method === 'Credit' && sale.customerId) {
    const c = DB.customers.find(x => x.id === sale.customerId);
    if (c) {
      c.owed += balance;
      c.totalBought += t.total;
      if (balance > 0 && !c.due) c.due = dayKey(shiftDay(7));
    }
  }
  persist();

  S.lastSale = sale.id;
  S.cart = []; S.discount = 0; S.paid = ''; S.method = 'Cash'; S.creditCust = ''; S.creditPaid = '';
  refreshPOS();
  toast('Sale completed — stock updated.');
  showReceipt(sale.id);
}

function readProductForm() {
  const v = id => document.getElementById(id).value.trim();
  const name = v('pf-name'), buy = Number(v('pf-buy')), retail = Number(v('pf-retail')),
    ws = Number(v('pf-ws')), stock = Number(v('pf-stock') || 0), barcode = v('pf-barcode');
  const err = document.getElementById('pf-error');
  const fail = m => { if (err) err.textContent = m; return null; };
  if (!name) return fail('Product name is required.');
  const rawType = document.getElementById('pf-type').value;
  const type = normTypeName(rawType);
  if (!type) return fail('Pick a product type (or add a new one).');
  if (isNaN(buy) || buy < 0 || isNaN(retail) || retail < 0 || isNaN(ws) || ws < 0) return fail('Enter valid prices (0 or more).');
  if (isNaN(stock) || stock < 0) return fail('Stock must be 0 or more.');
  /* auto-register a brand-new typed value so filters/POS pick it up immediately */
  try {
    const sh = myShop();
    if (sh) {
      if (!Array.isArray(sh.ptypes)) sh.ptypes = shopTypes(sh.id);
      if (!sh.ptypes.some(t => String(t).toLowerCase() === type.toLowerCase())) {
        sh.ptypes.push(type);
        persist();
      }
    }
  } catch (e) { }
  return {
    name, type: type, barcode: barcode || ('SS' + Date.now().toString().slice(-8)),
    buy, retail, wholesale: ws, stock
  };
}

    '<ul class="space-y-2">' +

  h += '</div></div>';
  return h;

/* ================= Reports page ================= */
const REP_TABS = [
  { id: 'sales', label: 'Sales Report' },
  { id: 'stock', label: 'Stock Report' },
  { id: 'profit', label: 'Profit Report' },
  { id: 'debt', label: 'People Who Owe Me' },
  { id: 'supplier', label: 'Supplier Report' }
];
function repRange() {
  let from = S.repFrom || dayKey(shiftDay(-29));
  let to = S.repTo || dayKey();
  if (to < from) { const t = from; from = to; to = t; }
  return { from, to };
}
function repData() {
  const sh = myShop();
  const r = repRange();
  if (S.repTab === 'sales') {
    const rows = salesBetween(sh.id, r.from, r.to).slice().sort((a, b) => (b.ts > a.ts ? 1 : -1));
    return {
      title: 'Sales Report (' + fmtDate(r.from) + ' – ' + fmtDate(r.to) + ')',
      headers: ['Date', 'Receipt', 'Cashier', 'Items', 'Method', 'Total', 'Paid', 'Balance', 'Profit'],
      rows: rows.map(s => [fmtDate(s.day), s.receipt, s.cashier, s.items.reduce((t, i) => t + i.qty, 0), s.method, fmt(s.total), fmt(s.paid || 0), fmt(s.method === 'Credit' ? (s.balance != null ? s.balance : (s.total - (s.paid || 0))) : 0), fmt(saleProfit(s))]),
      footers: ['', 'TOTAL (' + rows.length + ' sales)', '', '', '', fmt(sum(rows, s => s.total)), fmt(sum(rows, s => (s.paid || 0))), fmt(sum(rows, s => (s.method === 'Credit' ? (s.balance != null ? s.balance : (s.total - (s.paid || 0))) : 0))), fmt(sum(rows, saleProfit))],
      csvFoot: ['TOTAL', '', '', '', sum(rows, s => s.total), sum(rows, s => (s.paid || 0)), sum(rows, s => (s.method === 'Credit' ? (s.balance != null ? s.balance : (s.total - (s.paid || 0))) : 0)), sum(rows, saleProfit)]
    };
  }
  if (S.repTab === 'stock') {
    const list = productsOf(sh.id);
    return {
      title: 'Stock Report (as at ' + fmtDate(dayKey()) + ')',
      headers: ['Product', 'Type', 'Barcode', 'Stock', 'Buying', 'Retail', 'Stock value'],
      rows: list.map(p => [p.name, p.type, p.barcode, p.stock, fmt(p.buy), fmt(p.retail), fmt(p.buy * p.stock)]),
      footers: ['TOTAL', '', '', sum(list, p => p.stock), '', '', fmt(sum(list, p => p.buy * p.stock))],
      csvFoot: ['TOTAL', '', '', sum(list, p => p.stock), '', '', sum(list, p => p.buy * p.stock)]
    };
  }
  if (S.repTab === 'profit') {
    const rows = [];
    let d0 = new Date(r.from + 'T00:00:00'), d1 = new Date(r.to + 'T00:00:00');
    for (let d = new Date(d0); d <= d1; d.setDate(d.getDate() + 1)) {
      const k = dayKey(d);
      const ss = salesOn(sh.id, k);
      if (!ss.length && !expensesOn(sh.id, k).length) continue;
      const sales = sum(ss, s => s.total);
      const cogs = sum(ss, saleCost);
      const exp = sum(expensesOn(sh.id, k), e => e.amount);
      rows.push([fmtDate(k), fmt(sales), fmt(cogs), fmt(exp), fmt(sales - cogs - exp)]);
    }
    const salesT = rows.reduce((t, x) => t + Number(String(x[1]).replace(/,/g, '')), 0);
    const cogsT = rows.reduce((t, x) => t + Number(String(x[2]).replace(/,/g, '')), 0);
    const expT = rows.reduce((t, x) => t + Number(String(x[3]).replace(/,/g, '')), 0);
    return {
      title: 'Profit Report (' + fmtDate(r.from) + ' – ' + fmtDate(r.to) + ')',
      headers: ['Date', 'Sales', 'Cost of goods', 'Expenses', 'Net profit'],
      rows: rows,
      footers: ['TOTAL', fmt(salesT), fmt(cogsT), fmt(expT), fmt(salesT - cogsT - expT)],
      csvFoot: ['TOTAL', salesT, cogsT, expT, salesT - cogsT - expT]
    };
  }
  if (S.repTab === 'debt') {
    const list = customersOf(sh.id).filter(c => c.owed > 0).sort((a, b) => b.owed - a.owed);
    return {
      title: 'People Who Owe Me (as at ' + fmtDate(dayKey()) + ')',
      headers: ['Customer', 'Phone', 'Total bought', 'Owes', 'Due date'],
      rows: list.map(c => [c.name, c.phone, fmt(c.totalBought), fmt(c.owed), c.due ? fmtDate(c.due) : '—']),
      footers: ['TOTAL (' + list.length + ' people)', '', '', fmt(sum(list, c => c.owed)), ''],
      csvFoot: ['TOTAL', '', sum(list, c => c.totalBought), sum(list, c => c.owed), '']
    };
  }
  /* supplier */
  const sups = suppliersOf(sh.id);
  const purs = DB.purchases.filter(p => p.shopId === sh.id);
  return {
    title: 'Supplier Report (as at ' + fmtDate(dayKey()) + ')',
    headers: ['Supplier', 'Phone', 'Purchases', 'Total cost', 'Paid', 'Balance owed'],
    rows: sups.map(function (s) {
      const pp = purs.filter(p => p.supplierId === s.id);
      return [s.name, s.phone, pp.length, fmt(sum(pp, p => p.cost)), fmt(sum(pp, p => p.paid)), fmt(s.owed)];
    }),
    footers: ['TOTAL', '', purs.length, fmt(sum(purs, p => p.cost)), fmt(sum(purs, p => p.paid)), fmt(sum(sups, s => s.owed))],
    csvFoot: ['TOTAL', '', purs.length, sum(purs, p => p.cost), sum(purs, p => p.paid), sum(sups, s => s.owed)]
  };
}

ACTIONS['save-supplier-payment'] = d => {
  const s = DB.suppliers.find(x => x.id === d.id);
  if (!s) return;
  const amt = Number((document.getElementById('sup-pay') || {}).value);
  const err = document.getElementById('sup-pay-error');
  const fail = m => { if (err) err.textContent = m; else toast(m, 'error'); };
  if (isNaN(amt) || amt <= 0) return fail('Enter an amount greater than 0.');
  if (amt > s.owed) return fail('Amount is more than what you owe ' + s.name + ' (' + fmt(s.owed) + ').');
  s.owed = Math.max(0, Math.round((s.owed - amt) * 100) / 100);
  /* settle oldest unpaid purchases first so Paid/Balance columns stay correct */
  let remaining = amt;
  DB.purchases
    .filter(p => p.supplierId === s.id && p.balance > 0)
    .sort((a, b) => (a.day > b.day ? 1 : a.day < b.day ? -1 : 0))
    .forEach(function (p) {
      if (remaining <= 0) return;
      const take = Math.min(p.balance, remaining);
      p.paid += take;
      p.balance = Math.max(0, p.cost - p.paid);
      remaining -= take;
    });
  persist(); closeModal(); render();
  toast('Payment of ' + fmt(amt) + ' to ' + s.name + ' recorded. Balance: ' + fmt(s.owed) + '.');
};

ACTIONS['create-purchase'] = () => {
  const v = id => document.getElementById(id).value.trim();
  const supId = v('pu-sup'), prodId = v('pu-prod'), day = v('pu-date') || dayKey();
  const qty = Number(v('pu-qty')), unit = Number(v('pu-unit')), paid = Number(v('pu-paid'));
  const err = document.getElementById('pu-error');
  const fail = m => { if (err) err.textContent = m; };
  if (!supId || !prodId) return fail('Supplier and product are required.');
  if (isNaN(qty) || qty < 1) return fail('Quantity must be 1 or more.');
  if (isNaN(unit) || unit < 0) return fail('Unit cost must be 0 or more.');
  if (isNaN(paid) || paid < 0) return fail('Paid amount must be 0 or more.');
  const cost = qty * unit;
  if (paid > cost) return fail('Paid amount cannot be more than the cost.');
  const sup = DB.suppliers.find(x => x.id === supId);
  const prod = DB.products.find(x => x.id === prodId);
  DB.purchases.push({
    id: uid('pu'), shopId: myShop().id, day: day, supplierId: sup.id, supplierName: sup.name,
    productId: prod.id, productName: prod.name, qty: qty, cost: cost, paid: paid, balance: cost - paid
  });
  sup.owed += (cost - paid);
  prod.stock += qty;               /* stock up automatically */
  persist(); closeModal(); render();
  toast('Purchase saved — stock of ' + prod.name + ' is now ' + prod.stock + '.');
};

/* Analytics engine part 1: state + date ranges (real localStorage data only) */
function anDefaults(){return{preset:'30d',from:'',to:'',cat:'All',pay:'All',tab:'overview',chart:'bar',q:'',sort:'revenue_desc',page:1};}
function anState(){if(!S.an)S.an=anDefaults();return S.an;}
function anTodayKey(){return dayKey(new Date());}
function anParseDay(k){const p=String(k).split('-');return new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));}
function anAddDays(k,n){const d=anParseDay(k);d.setDate(d.getDate()+n);return dayKey(d);}
function anMonthStart(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';}
function anQuarterStart(d){const q=Math.floor(d.getMonth()/3)*3;return d.getFullYear()+'-'+String(q+1).padStart(2,'0')+'-01';}
function anRange(){
const a=anState();const today=anTodayKey();const now=new Date();
let from='',to=today,label='';
if(a.preset==='today'){from=today;label='Today';}
else if(a.preset==='7d'){from=anAddDays(today,-6);label='Last 7 days';}
else if(a.preset==='30d'){from=anAddDays(today,-29);label='Last 30 days';}
else if(a.preset==='month'){from=anMonthStart(now);label='This month';}
else if(a.preset==='lastmonth'){const lm=new Date(now.getFullYear(),now.getMonth()-1,1);from=anMonthStart(lm);const end=new Date(now.getFullYear(),now.getMonth(),0);to=dayKey(end);label='Last month';}
else if(a.preset==='quarter'){from=anQuarterStart(now);label='This quarter';}
else if(a.preset==='year'){from=now.getFullYear()+'-01-01';label='This year';}
else if(a.preset==='all'){from='';to='';label='All time';}
else if(a.preset==='custom'){from=a.from||anAddDays(today,-29);to=a.to||today;if(to<from){const t=from;from=to;to=t;}label=fmtDate(from)+' - '+fmtDate(to);}
return{from:from,to:to,label:label};
}

/* Analytics calc: slices + KPIs from real DB */
function anProdMap(shopId){const m={};productsOf(shopId).forEach(p=>{m[p.id]=p;m[p.name]=p;});return m;}
function anSaleSlice(s,pmap,cat){let rev=0,cost=0,qty=0;s.items.forEach(it=>{const p=pmap[it.pid]||pmap[it.name];const t=p?p.type:null;if(cat&&cat!=='All'&&t!==cat)return;const pr=Number(it.price)||0,by=Number(it.buy)||0,q=Number(it.qty)||0;rev+=pr*q;cost+=by*q;qty+=q;});return{rev:rev,cost:cost,qty:qty};}
function anFilteredSales(shopId){const r=anRange(),a=anState(),pmap=anProdMap(shopId);return DB.sales.filter(s=>{if(s.shopId!==shopId)return false;if(r.from&&s.day<r.from)return false;if(r.to&&s.day>r.to)return false;if(a.pay&&a.pay!=='All'&&s.method!==a.pay)return false;if(a.cat&&a.cat!=='All'){const sl=anSaleSlice(s,pmap,a.cat);if(sl.qty<=0)return false;}return true;});}
function anFilteredExpenses(shopId){const r=anRange();return DB.expenses.filter(e=>{if(e.shopId!==shopId)return false;if(r.from&&e.day<r.from)return false;if(r.to&&e.day>r.to)return false;return true;});}
function anFilteredPurchases(shopId){const r=anRange();return DB.purchases.filter(p=>{if(p.shopId!==shopId)return false;if(r.from&&p.day<r.from)return false;if(r.to&&p.day>r.to)return false;return true;});}
function anDailySeries(shopId){const r=anRange(),a=anState(),pmap=anProdMap(shopId),out=[];const sales=anFilteredSales(shopId),byDay={},exByDay={};sales.forEach(s=>{const sl=anSaleSlice(s,pmap,a.cat);if(!byDay[s.day])byDay[s.day]={rev:0,cost:0,orders:0,qty:0};byDay[s.day].rev+=sl.rev;byDay[s.day].cost+=sl.cost;byDay[s.day].orders+=1;byDay[s.day].qty+=sl.qty;});anFilteredExpenses(shopId).forEach(e=>{exByDay[e.day]=(exByDay[e.day]||0)+Number(e.amount||0);});if(!r.from||!r.to){Object.keys(byDay).concat(Object.keys(exByDay)).filter((v,i,arr)=>arr.indexOf(v)===i).sort().forEach(k=>{const b=byDay[k]||{rev:0,cost:0,orders:0,qty:0};const ex=exByDay[k]||0;out.push({day:k,label:fmtShort(k),rev:b.rev,cost:b.cost,orders:b.orders,qty:b.qty,exp:ex,profit:b.rev-b.cost-ex});});return out;}let d0=anParseDay(r.from),d1=anParseDay(r.to);for(let d=new Date(d0);d<=d1;d.setDate(d.getDate()+1)){const k=dayKey(d);const b=byDay[k]||{rev:0,cost:0,orders:0,qty:0};const ex=exByDay[k]||0;out.push({day:k,label:fmtShort(k),rev:b.rev,cost:b.cost,orders:b.orders,qty:b.qty,exp:ex,profit:b.rev-b.cost-ex});}return out;}
function anPct(cur,prev){cur=Number(cur)||0;prev=Number(prev)||0;if(prev===0)return cur===0?0:100;return((cur-prev)/Math.abs(prev))*100;}
function anPrevRange(r){if(!r.from||!r.to)return{from:'',to:''};const len=Math.round((anParseDay(r.to)-anParseDay(r.from))/864e5)+1;return{from:anAddDays(r.from,-len),to:anAddDays(r.from,-1)};}

/* Analytics KPIs + product/category splits */
function anSumSales(shopId,from,to,cat,pay){const pmap=anProdMap(shopId);let rev=0,cost=0,orders=0,qty=0;DB.sales.forEach(s=>{if(s.shopId!==shopId)return;if(from&&s.day<from)return;if(to&&s.day>to)return;if(pay&&pay!=='All'&&s.method!==pay)return;const sl=anSaleSlice(s,pmap,cat);if(cat&&cat!=='All'&&sl.qty<=0)return;rev+=sl.rev;cost+=sl.cost;qty+=sl.qty;orders+=1;});let exp=0;DB.expenses.forEach(e=>{if(e.shopId!==shopId)return;if(from&&e.day<from)return;if(to&&e.day>to)return;exp+=Number(e.amount||0);});return{rev:rev,cost:cost,orders:orders,qty:qty,exp:exp,gross:rev-cost,net:rev-cost-exp};}
function anKPIs(shopId){const r=anRange(),a=anState();const curM=anSumSales(shopId,r.from,r.to,a.cat,a.pay);const pr=anPrevRange(r);const prevM=(pr.from||pr.to)?anSumSales(shopId,pr.from,pr.to,a.cat,a.pay):null;const prods=productsOf(shopId);const invVal=sum(prods,p=>(Number(p.buy)||0)*(Number(p.stock)||0));const sh=shopById(shopId);const lowLevel=sh?sh.lowStockLevel:10;const low=prods.filter(p=>(Number(p.stock)||0)<=lowLevel).length;const out=prods.filter(p=>(Number(p.stock)||0)<=0).length;const owed=sum(customersOf(shopId),c=>Number(c.owed)||0);const supOwed=sum(suppliersOf(shopId),s=>Number(s.owed)||0);const purs=anFilteredPurchases(shopId);const purCost=sum(purs,p=>Number(p.cost)||0);return{range:r,prev:prevM,rev:curM.rev,orders:curM.orders,qty:curM.qty,avg:curM.orders?curM.rev/curM.orders:0,cogs:curM.cost,exp:curM.exp,gross:curM.gross,net:curM.net,grossMargin:curM.rev?(curM.gross/curM.rev)*100:0,netMargin:curM.rev?(curM.net/curM.rev)*100:0,invVal:invVal,nProds:prods.length,low:low,out:out,owed:owed,supOwed:supOwed,purCost:purCost,nPur:purs.length,revGrowth:prevM?anPct(curM.rev,prevM.rev):0,orderGrowth:prevM?anPct(curM.orders,prevM.orders):0,profitGrowth:prevM?anPct(curM.net,prevM.net):0,hasPrev:!!prevM};}
function anProductPerf(shopId){const a=anState(),pmap=anProdMap(shopId),sales=anFilteredSales(shopId),map={};productsOf(shopId).forEach(p=>{if(a.cat!=='All'&&p.type!==a.cat)return;map[p.id]={id:p.id,name:p.name,type:p.type,stock:Number(p.stock)||0,buy:Number(p.buy)||0,retail:Number(p.retail)||0,qty:0,rev:0,cost:0};});sales.forEach(s=>{s.items.forEach(it=>{const p=pmap[it.pid]||pmap[it.name];if(!p)return;if(a.cat!=='All'&&p.type!==a.cat)return;let row=map[p.id];if(!row){row={id:p.id,name:it.name,type:p.type||'-',stock:Number(p.stock)||0,buy:Number(it.buy)||0,retail:Number(it.price)||0,qty:0,rev:0,cost:0};map[p.id]=row;}const q=Number(it.qty)||0;row.qty+=q;row.rev+=q*(Number(it.price)||0);row.cost+=q*(Number(it.buy)||0);});});return Object.keys(map).map(k=>{const r2=map[k];r2.profit=r2.rev-r2.cost;r2.margin=r2.rev?(r2.profit/r2.rev)*100:0;r2.stockVal=r2.buy*r2.stock;return r2;});}
function anCategoryPerf(shopId){const rows=anProductPerf(shopId),m={};rows.forEach(r2=>{const k=r2.type||'-';if(!m[k])m[k]={cat:k,qty:0,rev:0,cost:0,stockVal:0,n:0};m[k].qty+=r2.qty;m[k].rev+=r2.rev;m[k].cost+=r2.cost;m[k].stockVal+=r2.stockVal;m[k].n+=1;});return Object.keys(m).map(k=>{const r2=m[k];r2.profit=r2.rev-r2.cost;r2.margin=r2.rev?(r2.profit/r2.rev)*100:0;return r2;}).sort((x,y)=>y.rev-x.rev);}

/* Analytics splits + smart insights (computed, not AI) */
function anPaySplit(shopId){const sales=anFilteredSales(shopId),a=anState(),pmap=anProdMap(shopId),m={};sales.forEach(s=>{const sl=anSaleSlice(s,pmap,a.cat);if(!m[s.method])m[s.method]={method:s.method,rev:0,orders:0};m[s.method].rev+=sl.rev;m[s.method].orders+=1;});return Object.keys(m).map(k=>m[k]).sort((x,y)=>y.rev-x.rev);}
function anExpenseSplit(shopId){const m={};anFilteredExpenses(shopId).forEach(e=>{const k=e.cat||'Other';m[k]=(m[k]||0)+Number(e.amount||0);});return Object.keys(m).map(k=>({cat:k,amt:m[k]})).sort((x,y)=>y.amt-x.amt);}
function anInsights(shopId){const k=anKPIs(shopId),prods=anProductPerf(shopId),cats=anCategoryPerf(shopId),exps=anExpenseSplit(shopId),sh=shopById(shopId),lowLevel=sh?sh.lowStockLevel:10,out=[];
if(k.hasPrev&&(k.rev>0||k.prev.rev>0)){const up=k.rev>=k.prev.rev;out.push({tone:up?'good':'bad',title:(up?'Sales up ':'Sales down ')+Math.abs(k.revGrowth).toFixed(1)+'% vs previous period',detail:'Revenue '+ugx(k.rev)+' vs '+ugx(k.prev.rev)+' ('+k.orders+' vs '+k.prev.orders+' orders).',action:up?'Keep best-sellers stocked.':'Restock winners and review slow days.'});}
const sorted=prods.slice().sort((x,y)=>y.rev-x.rev);
if(sorted.length&&sorted[0].rev>0)out.push({tone:'good',title:'Top earner: '+sorted[0].name,detail:fmt(sorted[0].qty)+' units, '+ugx(sorted[0].rev)+' revenue, '+ugx(sorted[0].profit)+' profit.',action:'Never let it run out.'});
if(cats.length&&cats[0].rev>0){const share=k.rev?(cats[0].rev/k.rev)*100:0;out.push({tone:'info',title:cats[0].cat+' drives '+share.toFixed(0)+'% of revenue',detail:ugx(cats[0].rev)+' from '+fmt(cats[0].qty)+' units.',action:'Feature this category.'});}
prods.filter(p=>p.stock<=lowLevel&&p.qty>0).sort((x,y)=>y.qty-x.qty).slice(0,3).forEach(p=>{out.push({tone:'warn',title:'Restock soon: '+p.name,detail:'Only '+fmt(p.stock)+' left, sold '+fmt(p.qty)+' in period.',action:'Reorder now.'});});
prods.filter(p=>p.stock>lowLevel*2&&p.qty===0).slice(0,2).forEach(p=>{out.push({tone:'warn',title:'Possible dead stock: '+p.name,detail:fmt(p.stock)+' units, zero sales. Tied: '+ugx(p.stockVal)+'.',action:'Discount or bundle.'});});
if(exps.length)out.push({tone:'info',title:'Biggest expense: '+exps[0].cat,detail:ugx(exps[0].amt)+' of '+ugx(k.exp)+' total.',action:'Review '+exps[0].cat+' receipts.'});
prods.filter(p=>p.rev>0&&p.margin<0).slice(0,2).forEach(p=>{out.push({tone:'bad',title:'Losing money: '+p.name,detail:'Revenue '+ugx(p.rev)+' below cost '+ugx(p.cost)+'.',action:'Raise price or cut discount.'});});
if(!out.length)out.push({tone:'info',title:'Not enough data yet',detail:'Record sales to unlock insights.',action:'Go to Selling (POS).'});
return out.slice(0,8);}

/* Analytics extra: bucketing + customer/supplier performance */
function anBucketed(daily){if(daily.length<=31)return{rows:daily,mode:'day'};if(daily.length<=120){const rows=[];let cur=null;daily.forEach((d,i)=>{if(i%7===0){cur={day:d.day,label:'Wk '+d.label,rev:0,cost:0,orders:0,qty:0,exp:0,profit:0};rows.push(cur);}cur.rev+=d.rev;cur.cost+=d.cost;cur.orders+=d.orders;cur.qty+=d.qty;cur.exp+=d.exp;cur.profit+=d.profit;});return{rows:rows,mode:'week'};}const map={};daily.forEach(d=>{const mk=d.day.slice(0,7);if(!map[mk])map[mk]={day:mk+'-01',label:mk.slice(5)+'/'+mk.slice(2,4),rev:0,cost:0,orders:0,qty:0,exp:0,profit:0};map[mk].rev+=d.rev;map[mk].cost+=d.cost;map[mk].orders+=d.orders;map[mk].qty+=d.qty;map[mk].exp+=d.exp;map[mk].profit+=d.profit;});return{rows:Object.keys(map).sort().map(k=>map[k]),mode:'month'};}
function anCustomerPerf(shopId){const r=anRange(),a=anState(),pmap=anProdMap(shopId),m={};DB.sales.forEach(s=>{if(s.shopId!==shopId)return;if(r.from&&s.day<r.from)return;if(r.to&&s.day>r.to)return;if(a.pay!=='All'&&s.method!==a.pay)return;const sl=anSaleSlice(s,pmap,a.cat);if(a.cat!=='All'&&sl.qty<=0)return;const cid=s.customerId||('__walk_'+s.method);const c=s.customerId?DB.customers.find(x=>x.id===s.customerId):null;const nm=c?c.name:(s.method==='Credit'?'Unknown credit':'Walk-in ('+s.method+')');if(!m[cid])m[cid]={id:cid,name:nm,phone:c?c.phone:'',owed:c?(Number(c.owed)||0):0,due:c?c.due:'',orders:0,rev:0};m[cid].orders+=1;m[cid].rev+=sl.rev;});return Object.keys(m).map(k=>m[k]).sort((x,y)=>y.rev-x.rev);}
function anSupplierPerf(shopId){const purs=anFilteredPurchases(shopId),sups=suppliersOf(shopId),m={};sups.forEach(s=>{m[s.id]={id:s.id,name:s.name,phone:s.phone,owed:Number(s.owed)||0,orders:0,cost:0,paid:0};});purs.forEach(p=>{if(!m[p.supplierId])m[p.supplierId]={id:p.supplierId,name:p.supplierName||'-',phone:'',owed:0,orders:0,cost:0,paid:0};m[p.supplierId].orders+=1;m[p.supplierId].cost+=Number(p.cost)||0;m[p.supplierId].paid+=Number(p.paid)||0;});return Object.keys(m).map(k=>m[k]).sort((x,y)=>y.cost-x.cost);}

/* Analytics charts: dependency-free SVG (works offline, no CDN) */
function anEsc(s){return esc(s);}
function anChartWrap(id,title,sub,inner){return '<div class="card p-4"><div class="flex items-start justify-between gap-2 mb-2"><div><h3 class="font-bold text-slate-800 text-sm">'+anEsc(title)+'</h3>'+(sub?'<p class="text-xs text-slate-500">'+anEsc(sub)+'</p>':'')+'</div></div><div id="'+id+'">'+inner+'</div></div>';}
function anEmpty(msg){return '<div class="py-10 text-center text-sm text-slate-400">'+anEsc(msg)+'</div>';}
function anBarsSVG(rows,getVal,opts){opts=opts||{};const W=560,H=170,pad=26;const vals=rows.map(getVal);const max=Math.max(1,...vals);const n=Math.max(1,rows.length);const bw=(W-pad*2)/n;let s='<svg viewBox="0 0 '+W+' '+H+'" class="w-full" style="height:190px" role="img">';for(let g=0;g<=3;g++){const y=8+(H-40)*g/3;s+='<line x1="'+pad+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#e2e8f0" stroke-width="1"/>';}rows.forEach((r,i)=>{const v=vals[i];const h=Math.max(2,(v/max)*(H-48));const x=pad+i*bw+2;const y=H-26-h;const c=opts.colorFn?opts.colorFn(r,v):(opts.color||'#16a34a');s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+Math.max(2,bw-6).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+c+'"><title>'+anEsc(r.label)+': '+fmt(Math.round(v))+'</title></rect>';if(n<=16)s+='<text x="'+(x+bw/2-2).toFixed(1)+'" y="'+(H-10)+'" font-size="9" fill="#64748b" text-anchor="middle">'+anEsc(String(r.label).slice(0,6))+'</text>';});s+='</svg>';return s;}
function anLineSVG(rows,series){const W=560,H=180,pad=30;const all=[];series.forEach(s2=>rows.forEach(r=>all.push(s2.get(r))));const max=Math.max(1,...all);let s='<svg viewBox="0 0 '+W+' '+H+'" class="w-full" style="height:200px" role="img">';for(let g=0;g<=3;g++){const y=10+(H-46)*g/3;s+='<line x1="'+pad+'" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#e2e8f0"/>';}const X=i=>rows.length<2?pad+(W-pad)/2:pad+i*(W-pad)/(rows.length-1);const Y=v=>10+(H-46)*(1-Math.min(1,v/max));series.forEach(s2=>{let d='';rows.forEach((r,i)=>{d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(s2.get(r)).toFixed(1)+' ';});s+='<path d="'+d+'" fill="none" stroke="'+s2.color+'" stroke-width="2.5" stroke-linejoin="round"/>';rows.forEach((r,i)=>{s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(s2.get(r)).toFixed(1)+'" r="3" fill="'+s2.color+'"><title>'+anEsc(r.label)+': '+anEsc(s2.name)+' '+fmt(Math.round(s2.get(r)))+'</title></circle>';});});s+='<text x="'+(W-4)+'" y="'+(H-6)+'" font-size="9" fill="#64748b" text-anchor="end">Max '+fmt(Math.round(max))+'</text>';s+='</svg>';s+='<div class="flex flex-wrap gap-3 mt-1">'+series.map(s2=>'<span class="text-xs font-semibold text-slate-600"><span class="inline-block w-3 h-2 rounded" style="background:'+s2.color+'"></span> '+anEsc(s2.name)+'</span>').join('')+'</div>';return s;}

/* Analytics page part 1: filters + KPI cards */

function anFiltersHTML(sh){const a=anState(),r=anRange();let h='<div class="card p-3 space-y-3">';h+='<div class="flex flex-wrap gap-1.5">'+AN_PRESETS.map(p=>'<button class="btn btn-sm '+(a.preset===p[0]?'bg-brand-600 text-white hover:bg-brand-700':'bg-slate-100 text-slate-600 hover:bg-slate-200')+'" data-action="an-preset" data-p="'+p[0]+'">'+p[1]+'</button>').join('')+'</div>';h+='<div class="flex flex-wrap items-center gap-2 text-sm">';if(a.preset==='custom')h+='<label class="text-xs font-bold text-slate-500">From</label><input type="date" class="input py-1.5 w-auto" value="'+esc(a.from||r.from)+'" data-change="an-from"><label class="text-xs font-bold text-slate-500">To</label><input type="date" class="input py-1.5 w-auto" value="'+esc(a.to||r.to)+'" data-change="an-to">';h+='<label class="text-xs font-bold text-slate-500 ml-1">Category</label><select class="input py-1.5 w-auto" data-change="an-cat"><option'+(a.cat==='All'?' selected':'')+'>All</option>'+shopTypes(sh?sh.id:null).map(t=>'<option'+(a.cat===t?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>';h+='<label class="text-xs font-bold text-slate-500 ml-1">Payment</label><select class="input py-1.5 w-auto" data-change="an-pay">'+['All'].concat(METHODS).map(m=>'<option'+(a.pay===m?' selected':'')+'>'+m+'</option>').join('')+'</select>';h+='<span class="text-xs text-slate-500 ml-auto font-semibold">'+esc(r.label)+' · '+esc(cur())+'</span></div>';h+='<div class="flex gap-1.5 flex-wrap border-t border-slate-100 pt-2">'+AN_TABS.map(t=>'<button class="btn btn-sm '+(a.tab===t[0]?'bg-slate-800 text-white':'bg-slate-100 text-slate-600 hover:bg-slate-200')+'" data-action="an-tab" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'<span class="flex-1"></span><button class="btn-ghost btn-sm" data-action="an-export">' + bi('download') + ' CSV</button><button class="btn-ghost btn-sm" data-action="an-print">' + bi('printer-fill') + ' Print</button></div>';h+='</div>';return h;}

function anOverviewHTML(sh,k,daily,bk,prods,cats){let h='<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">';h+=anKpi('Revenue',fmt(k.rev)+' <span class="text-xs font-bold text-slate-400">'+esc(cur())+'</span>',k.orders+' orders · avg '+fmt(Math.round(k.avg)),k.hasPrev?anDelta(k.revGrowth)+' <span class="text-[11px] text-slate-400">vs prev</span>':'<span class="text-[11px] text-slate-400">no previous period</span>');h+=anKpi('Net profit',fmt(k.net),k.net>=0?'after costs + expenses':'loss this period');h+=anKpi('Gross margin',k.grossMargin.toFixed(1)+'%','net '+k.netMargin.toFixed(1)+'%');h+=anKpi('Inventory value',fmt(k.invVal),k.nProds+' products · '+k.low+' low');h+='</div>';const hasSales=daily.some(d=>d.rev>0);h+=anChartWrap('an-c1','Revenue trend ('+bk.mode+')',k.range.label,hasSales?anLineSVG(bk.rows,[{name:'Revenue',color:'#16a34a',get:r=>r.rev},{name:'Profit',color:'#0ea5e9',get:r=>r.profit}]):anEmpty('No sales in this period. Try a wider date range.'));let h2='<div class="grid gap-4 lg:grid-cols-2">';const top=prods.slice().sort((x,y)=>y.rev-x.rev).slice(0,6);h2+=anChartWrap('an-c2','Top products by revenue','units sold in period',top.length&&top[0].rev>0?anBarsSVG(top,r=>r.rev,{color:'#16a34a'}):anEmpty('No product sales in this period.'));h2+=anChartWrap('an-c3','Revenue by category','share of period revenue',cats.length&&cats[0].rev>0?anBarsSVG(cats,r=>r.rev,{color:'#0ea5e9'}):anEmpty('No category sales in this period.'));h2+='</div>';const ins=anInsights(sh.id);let ih='<div class="card p-4"><h3 class="font-bold text-slate-800 text-sm mb-3 h-ic">' + bi('lightbulb-fill', 'text-amber-500') + ' Smart insights (from your real records)</h3><div class="grid gap-2 md:grid-cols-2">'+ins.map(n=>{const dot=n.tone==='good'?'bg-green-500':n.tone==='bad'?'bg-red-500':n.tone==='warn'?'bg-amber-500':'bg-sky-500';return '<div class="border border-slate-200 rounded-lg p-3"><div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full '+dot+'"></span><span c function updatePurchaseBalance() {
  const el = document.getElementById('pu-balance');
  if (!el) return;
  const qty = Number((document.getElementById('pu-qty') || {}).value || 0);
  const unit = Number((document.getElementById('pu-unit') || {}).value || 0);
  const paid = Number((document.getElementById('pu-paid') || {}).value || 0);
  const bal = Math.max(0, (isNaN(qty) ? 0 : qty) * (isNaN(unit) ? 0 : unit) - (isNaN(paid) ? 0 : paid));
  el.textContent = fmt(bal) + ' ' + (myShop() ? myShop().currency : 'UGX');
}
function handleLogoFile(file) {
  if (!file) return;
  if (file.size > 700 * 1024) { toast('Image too big — please choose a smaller logo (under 700KB).', 'error'); return; }
  const reader = new FileReader();
  reader.onload = function (e) {
    const img = new Image();
    img.onload = function () {
      /* downscale to 160px so LocalStorage stays small */
      const size = 160;
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const ratio = Math.min(size / img.width, size / img.height);
      const w = img.width * ratio, h = img.height * ratio;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, size, size);
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      myShop().logo = canvas.toDataURL('image/png');
      persist(); render();
      toast('Logo updated — it will print on your receipts.');
    };
    img.onerror = function () { toast('Could not read that image.', 'error'); };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

document.addEventListener('click', function (ev) {
  const target = ev.target;
  const el = target.closest('[data-action]');
  if (!el) return;
  // Ignore clicks on form controls (input/textarea/select) so typing in forms isn't hijacked by submit actions
  const tag = target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const name = el.getAttribute('data-action');
  const fn = ACTIONS[name];
  if (!fn) return;
  if (el.tagName === 'A') ev.preventDefault();
  const d = {};
  for (const a of el.attributes) {
    if (a.name.indexOf('data-') === 0 && a.name !== 'data-action') {
      d[a.name.slice(5).replace(/-([a-z])/g, (m, c) => c.toUpperCase())] = a.value;
    }
  }
  fn(d, el, ev);
});

document.addEventListener('change', function (ev) {
  const el = ev.target;
  const name = el.getAttribute && el.getAttribute('data-change');
  if (!name) return;
  if (name === 'pos-search') { S.posQ = el.value; refreshPOS(); focusBack(el); }
  else if (name === 'prod-search') { S.prodQ = el.value; const t = document.getElementById('prod-table'); if (t) t.innerHTML = productsTableHTML(); focusBack(el); }
  else if (name === 'discount') { S.discount = Math.max(0, Number(el.value) || 0); refreshPOSKeepFocus('discount-input'); }
  else if (name === 'paid') { S.paid = el.value; refreshPOSKeepFocus('paid-input'); }
  else if (name === 'credit-paid') { S.creditPaid = el.value; refreshPOSKeepFocus('credit-paid-input'); }
  else if (name === 'credit-cust') { S.creditCust = el.value; refreshPOS(); }
  else if (name === 'pu-calc') { updatePurchaseBalance(); }
  else if (name === 'rep-from') { S.repFrom = el.value; render(); }
  else if (name === 'rep-to') { S.repTo = el.value; render(); }
  else if (name === 'an-from') { anState().from = el.value; anState().preset = 'custom'; anState().page = 1; render(); }

  else if (name === 'an-pay') { anState().pay = el.value; anState().page = 1; render(); }
  else if (name === 'an-sort') { anState().sort = el.value; anState().page = 1; render(); }
  else if (name === 'sup-sort') { S.supSort = el.value; render(); }
  else if (name === 'sup-search') { S.supQ = el.value; render(); }
  else if (name === 'logo-file') { handleLogoFile(el.files && el.files[0]); }
});

    ev.preventDefault();
    doLogin();
  }
});

/* ================= Boot ================= */
(function boot() {
  loadDB();
  try {
    const sid = localStorage.getItem(SESSION_KEY);
    if (sid) {
      const u = DB.users.find(x => x.id === sid);
      if (u && u.status === 'active') {
        S.user = u;
        S.page = u.role === 'super' ? 'super' : u.role === 'cashier' ? 'pos' : 'dashboard';
      } else {
        localStorage.removeItem(SESSION_KEY);
      }
    }
  } catch (e) { }
  render();
})();
</script>
</body>
